h1,h2,h3,h4{margin:0;line-height:1.45;font-weight:800}

/* ---------- scrollbars ---------- */
.thin-scroll{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
.thin-scroll::-webkit-scrollbar{width:8px;height:8px}
.thin-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
.thin-scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.shell{display:flex;align-items:flex-start;min-height:100vh}
.sidebar{
  width:var(--sb-w); flex:0 0 var(--sb-w);
  position:sticky; top:0; height:100vh;
  background:var(--card); border-left:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden; z-index:40;
}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--border-soft);text-align:center;flex:0 0 auto}
.sb-logo{width:54px;height:54px;border-radius:16px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,var(--em-700),var(--em-900));color:#fff;font-size:24px;box-shadow:var(--shadow-sm)}
.sb-title{font-size:16px;font-weight:900;color:var(--em-900);line-height:1.4}
.sb-org{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6}
.sb-author{font-size:11.5px;color:var(--muted);margin-top:2px}
.sb-author b{color:var(--ink-soft);font-weight:700}
.sb-settings{margin-top:10px;display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;
  background:var(--em-50);border:1px solid var(--em-100);color:var(--em-800);font-size:11.5px;font-weight:700;transition:.15s}
.sb-settings:hover{background:var(--em-100)}
.sb-nav{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:12px 10px 28px}
.sb-link{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;font-size:14px;font-weight:700;
  color:var(--ink-soft);transition:.15s;margin-bottom:2px}
.sb-link:hover{background:var(--em-50);color:var(--em-800)}
.sb-link.active{background:var(--em-600);color:#fff}
.sb-link .ic{font-size:15px;line-height:1}
.sb-unit{margin-top:6px}
.sb-unit-btn{width:100%;display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;text-align:right;
  font-size:14px;font-weight:800;color:var(--ink);transition:.15s}
.sb-unit-btn:hover{background:var(--em-50)}
.sb-unit-btn.active{background:var(--em-50);color:var(--em-900)}
.sb-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.sb-unit-txt{flex:1 1 auto;min-width:0}
.sb-unit-sub{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-chev{flex:0 0 auto;color:var(--faint);font-size:12px;transition:transform .2s}
.sb-chev.open{transform:rotate(-90deg)}
.sb-sub{padding:2px 20px 6px 8px;display:none}
.sb-sub.open{display:block}
.sb-sub a{display:block;padding:5px 8px;border-radius:8px;font-size:12.3px;color:var(--muted);line-height:1.6;transition:.12s}
.sb-sub a:hover{background:var(--em-50);color:var(--em-800)}
.sb-sub a.cur{color:var(--em-800);font-weight:700;background:var(--em-50)}

.main{flex:1 1 auto;min-width:0;padding:26px 30px 120px}
.wrap{max-width:920px;margin:0 auto}

/* mobile bar */
.mbar{display:none;position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--border);
  padding:9px 14px;align-items:center;justify-content:space-between;gap:10px}
.mbar b{font-size:14px;color:var(--em-900)}
.mbtn{padding:7px 13px;border-radius:9px;background:var(--em-600);color:#fff;font-weight:700;font-size:13px}

/* ---------- generic pieces ---------- */
.hero{border-radius:22px;padding:34px 32px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--hero-a),var(--hero-b));box-shadow:var(--shadow)}
.hero h1{font-size:30px;font-weight:900;letter-spacing:-.3px}
.hero p{margin:12px 0 0;font-size:14.5px;line-height:1.9;color:#d1fae5;max-width:62ch}
.hero .lede{
  margin:18px 0 4px; font-size:16.5px; line-height:2.15; color:#b8e6d4; max-width:56ch;
  padding-inline-start:15px; border-inline-start:3px solid rgba(110,231,183,.5);
  text-align:start; text-wrap:pretty;
}
.hero .lede b{color:#fff;font-weight:800}
.hero .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(255,255,255,.14);color:#ecfdf5;border:1px solid rgba(255,255,255,.18)}
.hero .bar{margin-top:18px;height:6px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.hero .bar i{display:block;height:100%;background:#6ee7b7;border-radius:999px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.sec-title{font-size:19px;font-weight:900;color:var(--ink);margin:30px 0 12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;
  font-size:13.5px;font-weight:800;transition:.15s;border:1px solid transparent;white-space:nowrap}
.btn-em{background:var(--em-600);color:#fff;box-shadow:var(--shadow-sm)}
.btn-em:hover{background:var(--em-700)}
.btn-out{background:var(--card);color:var(--em-800);border-color:var(--border)}
.btn-out:hover{background:var(--em-50);border-color:var(--em-200)}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--border)}
.btn-game{background:linear-gradient(135deg,#6d28d9,#4c1d95);color:#fff;box-shadow:var(--shadow-sm)}
.btn-game:hover{background:linear-gradient(135deg,#5b21b6,#3b0764)}
.btn-ghost:hover{background:#f1f5f9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}

/* ---------- home ---------- */
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:14px}
.unit-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  display:flex;flex-direction:column;gap:9px;transition:.18s;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.unit-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--em-200)}
.unit-card .accent{position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px}
.unit-card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.unit-card .kicker{font-size:11.5px;font-weight:800;color:var(--em-700);letter-spacing:.2px}
.unit-card h3{font-size:16.5px;font-weight:900;color:var(--ink);line-height:1.55}
.unit-card .stats{font-size:12px;color:var(--muted)}
.unit-card .links{display:flex;flex-direction:column;gap:3px;margin-top:2px;padding-top:9px;border-top:1px dashed var(--border)}
.unit-card .links a{font-size:12.5px;color:var(--ink-soft);padding:3px 0;transition:.12s}
.unit-card .links a:hover{color:var(--em-700)}
.unit-card .links .more{font-size:11.5px;color:var(--faint)}

/* ---------- chapter ---------- */
.ch-head{margin-bottom:18px}
.ch-kicker{font-size:12.5px;font-weight:800;color:var(--em-700)}
.ch-head h1{font-size:26px;font-weight:900;margin-top:5px}
.obj{background:var(--em-50);border:1px solid var(--em-100);border-radius:var(--radius);padding:16px 18px;margin:16px 0 24px}
.obj h4{font-size:13.5px;color:var(--em-900);margin-bottom:6px}
.obj p{margin:0 0 10px;font-size:13.5px;color:#134e4a;line-height:1.85}
.obj .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
.obj .box{background:#fff;border:1px solid var(--em-100);border-radius:10px;padding:9px 12px}
.obj .box b{display:block;font-size:11.5px;color:var(--em-700);margin-bottom:2px}
.obj .box span{font-size:12.5px;color:var(--ink-soft)}

.toc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:26px}
.toc b{font-size:13px;color:var(--em-800);display:block;margin-bottom:6px}
.toc a{display:block;font-size:13px;color:var(--ink-soft);padding:3px 0;transition:.12s}
.toc a:hover{color:var(--em-700)}

.section{margin-bottom:34px;scroll-margin-top:20px}
.section > h2{font-size:18.5px;font-weight:900;color:var(--ink);padding-inline-start:12px;
  border-inline-start:4px solid var(--em-600);line-height:1.5;margin-bottom:12px}
.section p{margin:0 0 12px;font-size:15px;line-height:2;color:#1e293b;text-align:justify}
.note{background:var(--amber-bg);border:1px solid var(--amber-br);border-radius:12px;padding:12px 15px;margin:14px 0;
  font-size:13.8px;line-height:1.9;color:var(--amber-tx)}
.note::before{content:"💡 ";}
.quote{background:var(--em-50);border-inline-start:4px solid var(--em-600);border-radius:0 12px 12px 0;padding:13px 17px;margin:14px 0;
  font-size:14.5px;line-height:2;color:#134e4a;font-weight:500}
.formula{background:#0f172a;color:#a7f3d0;border-radius:12px;padding:14px 18px;margin:16px 0;text-align:center;
  font-size:16px;font-weight:700;letter-spacing:.3px;box-shadow:var(--shadow-sm)}
.deflist{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.deflist .it{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 14px}
.deflist .it b{color:var(--em-800);font-size:14px}
.deflist .it span{display:block;font-size:13.8px;color:var(--ink-soft);line-height:1.9;margin-top:3px}
.numlist{counter-reset:n;display:flex;flex-direction:column;gap:9px;margin:14px 0}
.numlist .it{position:relative;padding-inline-start:38px;background:var(--card);border:1px solid var(--border);
  border-radius:11px;padding-top:11px;padding-bottom:11px;padding-inline-end:14px}
.numlist .it::before{counter-increment:n;content:counter(n);position:absolute;inset-inline-start:11px;top:11px;
  width:22px;height:22px;border-radius:7px;background:var(--em-600);color:#fff;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.numlist .it b{color:var(--ink);font-size:14px}
.numlist .it span{display:block;font-size:13.8px;color:var(--ink-soft);line-height:1.9;margin-top:3px}

.tbl-wrap{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.tbl-cap{font-size:13px;font-weight:800;color:var(--em-800);padding:11px 14px;border-bottom:1px solid var(--border);background:var(--em-50)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.t th{background:#f8fafc;color:var(--ink);font-weight:800;padding:10px 13px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:10px 13px;border-bottom:1px solid var(--border-soft);color:var(--ink-soft);line-height:1.8;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:nth-child(even){background:#fcfdfd}

/* ---------- quizzes ---------- */
.qbox{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin:26px 0}
.qbox > h3{font-size:16px;font-weight:900;color:var(--em-900);margin-bottom:4px}
.qbox .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.q{padding:13px 0;border-top:1px solid var(--border-soft)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .qt{font-size:14.3px;font-weight:700;color:var(--ink);line-height:1.85;margin-bottom:9px}
.q .qt i{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:6px;
  background:var(--em-50);color:var(--em-800);font-size:11.5px;font-weight:800;font-style:normal;margin-inline-end:7px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{width:100%;text-align:right;padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  font-size:13.6px;color:var(--ink-soft);line-height:1.7;transition:.13s;display:flex;gap:8px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--em-200);background:var(--em-50)}
.opt .lbl{flex:0 0 auto;font-weight:800;color:var(--faint)}
.opt.ok{background:var(--em-50);border-color:var(--em-600);color:var(--em-900);font-weight:700}
.opt.ok .lbl{color:var(--em-700)}
.opt.bad{background:var(--red-bg);border-color:var(--red-br);color:var(--red-tx)}
.opt.bad .lbl{color:var(--red-tx)}
.opt:disabled{cursor:default}
.expl{margin-top:8px;font-size:12.8px;color:var(--ink-soft);background:#f8fafc;border:1px solid var(--border-soft);
  border-radius:9px;padding:9px 12px;line-height:1.85}
.score{margin-top:14px;padding:12px 15px;border-radius:11px;font-size:14px;font-weight:800;text-align:center}
.score.good{background:var(--em-50);color:var(--em-900);border:1px solid var(--em-200)}
.score.mid{background:var(--amber-bg);color:var(--amber-tx);border:1px solid var(--amber-br)}
.score.low{background:var(--red-bg);color:var(--red-tx);border:1px solid var(--red-br)}
.tfrow{display:flex;gap:7px;flex-wrap:wrap}
.tfrow .opt{width:auto;min-width:96px;justify-content:center}
.essay .it{border-top:1px solid var(--border-soft);padding:13px 0}
.essay .it:first-child{border-top:0}
.essay .ans{margin-top:9px;background:var(--em-50);border:1px solid var(--em-100);border-radius:10px;padding:11px 14px;
  font-size:13.6px;line-height:1.95;color:#134e4a}

/* ---------- glossary ---------- */
.term{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:12px 14px}
.term b{color:var(--em-800);font-size:13.8px}
.term span{display:block;font-size:13px;color:var(--ink-soft);line-height:1.85;margin-top:3px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px}

/* ---------- floating ---------- */
.fabs{position:fixed;bottom:20px;z-index:30;display:flex;flex-direction:column;gap:10px}
.fabs.lf{left:20px;align-items:flex-start}
.fabs.rt{right:calc(var(--sb-w) + 20px);align-items:flex-end}
.fab{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:800;
  color:#fff;box-shadow:var(--shadow-lg);transition:.16s}
.fab:hover{transform:translateY(-2px)}
.fab.green{background:var(--em-600)}
.fab.blue{background:#1d4ed8}
.fab-mini{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;box-shadow:var(--shadow);background:var(--card);border:1px solid var(--border);color:var(--ink-soft);transition:.16s}
.fab-mini:hover{background:var(--em-50);color:var(--em-800);transform:translateY(-2px)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;max-height:calc(100vh - 56px);overflow:hidden}
.modal.wide{max-width:860px}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex:0 0 auto}
.m-head h2{font-size:17px;font-weight:900;color:var(--em-900)}
.m-x{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:17px;transition:.13s}
.m-x:hover{background:#f1f5f9;color:var(--ink)}
.m-body{padding:18px 20px;overflow-y:auto;flex:1 1 auto}
.m-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-start;
  flex-wrap:wrap;flex:0 0 auto;background:#fbfdfc}

.field{margin-bottom:14px}
.field > label{display:block;font-size:13px;font-weight:800;color:var(--ink);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.7}
.inp{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);
  font-size:13.8px;transition:.13s;outline:none}
.inp:focus{border-color:var(--em-600);box-shadow:0 0 0 3px var(--em-50)}
textarea.inp{min-height:74px;resize:vertical;line-height:1.8}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:9px;border:1px solid var(--border);background:var(--card);
  font-size:12.8px;font-weight:700;color:var(--ink-soft);transition:.13s}
.seg button:hover{border-color:var(--em-200);background:var(--em-50)}
.seg button.on{background:var(--em-600);border-color:var(--em-600);color:#fff}
.chk{display:flex;align-items:flex-start;gap:8px;padding:8px 11px;border:1px solid var(--border);border-radius:10px;
  font-size:13px;color:var(--ink-soft);cursor:pointer;transition:.13s;background:var(--card);line-height:1.7}
.chk:hover{border-color:var(--em-200);background:var(--em-50)}
.chk input{margin-top:4px;accent-color:var(--em-600);flex:0 0 auto;width:15px;height:15px}
.chk.on{border-color:var(--em-600);background:var(--em-50);color:var(--em-900);font-weight:700}
.chklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.subchk{margin:7px 12px 4px;padding-inline-start:12px;border-inline-start:2px dashed var(--em-200);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.subchk .chk{font-size:12.3px;padding:6px 10px}
.logo-prev{flex:0 0 auto;height:58px;max-width:150px;object-fit:contain;background:#fff;
  border:1px solid var(--border);border-radius:10px;padding:5px}
.divider{height:1px;background:var(--border);margin:18px 0}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--em-50);color:var(--em-800);
  font-size:11.5px;font-weight:800;border:1px solid var(--em-100)}

/* ---------- presentation ---------- */
.pres{position:fixed;inset:0;z-index:200;background:linear-gradient(150deg,#062e22,#04150f);color:#fff;
  display:flex;flex-direction:column;padding:18px 22px}
.pres-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto}
.pres-top .l,.pres-top .r{display:flex;align-items:center;gap:8px}
.pres-btn{padding:7px 13px;border-radius:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  color:#d1fae5;font-size:12.5px;font-weight:700;transition:.13s}
.pres-btn:hover{background:rgba(255,255,255,.2)}
.pres-save{font-size:11.5px;color:#6ee7b7;display:inline-flex;align-items:center;gap:4px}
.pres-loc{font-size:12.5px;color:#a7f3d0;text-align:right;line-height:1.6}
.pres-stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 0}
.slide{width:100%;max-width:1000px;max-height:100%;overflow-y:auto;text-align:center;padding:8px 10px}
.slide .num{font-size:13px;color:#6ee7b7;font-weight:800;margin-bottom:12px;letter-spacing:.3px}
.slide h2{font-weight:900;color:#fff;line-height:1.5;margin-bottom:14px}
.slide h3{font-weight:800;color:#a7f3d0;line-height:1.6;margin-bottom:12px}
.slide p{color:#e2e8f0;line-height:2.05;margin:0 auto 12px;max-width:56ch;text-align:justify;text-align-last:center}
.slide ul{text-align:right;max-width:56ch;margin:0 auto;padding-inline-start:20px;color:#e2e8f0;line-height:2}
.slide .fx{display:inline-block;background:rgba(255,255,255,.08);border:1px solid rgba(110,231,183,.3);
  border-radius:12px;padding:12px 22px;color:#6ee7b7;font-weight:800}
.slide table{margin:0 auto;border-collapse:collapse;color:#e2e8f0;font-size:.9em}
.slide table th,.slide table td{border:1px solid rgba(255,255,255,.18);padding:7px 12px;text-align:right}
.slide table th{background:rgba(255,255,255,.08);color:#a7f3d0}
.pres-bot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.pres-count{font-size:12.5px;color:#94a3b8;font-weight:700;direction:ltr;unicode-bidi:isolate}
.pres-track{flex:1 1 auto;max-width:340px;height:4px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
.pres-track i{display:block;height:100%;background:#6ee7b7}

/* ---------- guide ---------- */
.g-sec{border:1px solid var(--border);border-radius:12px;margin-bottom:9px;overflow:hidden}
.g-sec > button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;
  text-align:right;font-size:14px;font-weight:800;color:var(--em-900);background:var(--em-50);transition:.13s}
.g-sec > button:hover{background:var(--em-100)}
.g-body{padding:13px 16px;display:none;background:var(--card)}
.g-body.open{display:block}
.g-body p{margin:0 0 10px;font-size:13.6px;line-height:1.95;color:var(--ink-soft);text-align:justify}
.g-body ol{margin:0;padding-inline-start:20px}
.g-body ol li{font-size:13.5px;line-height:1.95;color:var(--ink-soft);margin-bottom:7px}
.g-hit mark{background:#fef08a;color:inherit;border-radius:3px;padding:0 2px}

/* ---------- print ---------- */
.sheet{background:#fff;color:#000;padding:26px 30px;font-size:14px;line-height:1.9}
.sheet .hd{border-bottom:2px solid #065f46;padding-bottom:11px;margin-bottom:16px}
.sheet .hd .org{font-size:12px;color:#334155;line-height:1.7}
.sheet table.hdtop{width:100%;border-collapse:collapse;margin-bottom:6px}
.sheet table.hdtop td{border:0;padding:0;vertical-align:top}
.sheet td.c-org{width:38%}
.sheet td.c-logo{width:24%;text-align:center}
.sheet td.c-info{width:38%;text-align:left}
.sheet img.hdlogo{max-width:100%;object-fit:contain;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.sheet .hinfo{display:inline-block;font-size:12px;color:#334155;line-height:1.9;text-align:right}
.sheet .hinfo .r{white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.sheet .hinfo .r b{flex:0 0 auto;min-width:76px}
.sheet .hinfo .dots{display:inline-block;min-width:90px;border-bottom:1px dotted #475569}
.sheet .hd h1{font-size:19px;font-weight:900;color:#065f46;text-align:center;margin:8px 0 4px}
.sheet .hd .sub{text-align:center;font-size:12.5px;color:#475569}
.sheet .info{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;margin-bottom:16px;padding-bottom:11px;border-bottom:1px dashed #94a3b8}
.sheet .qq{margin-bottom:13px;break-inside:avoid}
.sheet .qq .t{font-weight:700;margin-bottom:5px}
.sheet .qq .oo{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;padding-inline-start:16px;font-size:13px}
.sheet .qq .oo.one{grid-template-columns:1fr}
.sheet .qq .oo.inl{display:flex;flex-wrap:wrap;gap:14px}
.sheet .ok{color:#047857;font-weight:800}
.sheet .key{margin-top:20px;padding-top:12px;border-top:2px solid #065f46;font-size:12.5px}
.sheet .key b{color:#065f46}
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .shell{display:block}
  .sidebar,.mbar,.fabs{display:none!important}
  .main{padding:0}
  .sheet{padding:0}
  .qbox,.card,.unit-card{box-shadow:none}
  .section{break-inside:auto}
  .q,.qq{break-inside:avoid}
  @page{margin:14mm}
}
.print-only{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){ .fabs.rt{right:calc(var(--sb-w) + 12px)} }
@media (max-width:900px){
  .shell{display:block}
  .mbar{display:flex}
  .sidebar{position:fixed;top:0;bottom:0;right:0;height:100vh;transform:translateX(105%);z-index:55;
    transition:transform .22s;box-shadow:var(--shadow-lg);width:min(320px,86vw);flex-basis:auto}
  .sidebar.open{transform:translateX(0)!important}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:54}
  .main{padding:18px 16px 130px}
  .hero{padding:24px 20px;border-radius:18px}
  .hero h1{font-size:23px}
  .fabs.rt{right:16px}
  .fabs.lf{left:16px}
  .fab{padding:10px 15px;font-size:12.5px}
  .unit-grid{grid-template-columns:1fr}
  .pres{padding:12px 14px}
}
@media (max-width:560px){
  .m-foot{flex-direction:column}
  .m-foot .btn{width:100%}
  .fab span.t{display:none}
  .fab{padding:12px 14px}
}
.fade{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ============================================================
   لعبة سلوك التكاليف — الأنماط
   كل الأصناف تبدأ بـ gm- حتى لا تتعارض مع أنماط التطبيق
   ============================================================ */
.gm{
  --g-ink:#0f172a; --g-soft:#475569; --g-muted:#64748b;
  --g-bg:#f4f8f6; --g-card:#fff; --g-br:#e2e8f0;
  --g-em:#059669; --g-em7:#047857; --g-em9:#064e3b; --g-em50:#ecfdf5; --g-em100:#d1fae5;
  --g-blue:#1d4ed8; --g-blue50:#eff6ff; --g-blue-br:#bfdbfe;
  --g-amber:#b45309; --g-amber50:#fffbeb; --g-amber-br:#fde68a;
  --g-red:#b91c1c; --g-red50:#fef2f2; --g-red-br:#fca5a5;
  --g-purple:#6d28d9; --g-purple50:#f5f3ff;
  --g-scale:1;
  position:fixed; inset:0; z-index:900; overflow-y:auto;
  background:var(--g-bg); color:var(--g-ink); direction:rtl;
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:calc(15px * var(--g-scale)); line-height:1.8;
}
.gm.big{ --g-scale:1.28; }
.gm *,.gm *::before,.gm *::after{box-sizing:border-box}
/* ملاحظة: لا نضبط هنا border/background/color لأن ".gm button" أقوى تخصيصاً من أصناف
   الأزرار نفسها (.gm-opt وغيرها) فكان يلغي حدودها وألوانها. كل زر يعرّف مظهره بنفسه. */
.gm button{font-family:inherit;font-size:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.gm input{font-family:inherit;font-size:inherit;color:inherit}
.gm h1,.gm h2,.gm h3{margin:0;line-height:1.4;font-weight:900}

.gm-wrap{max-width:1000px;margin:0 auto;padding:18px 18px 60px}
.gm-top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0 14px;border-bottom:1px solid var(--g-br);margin-bottom:18px;flex-wrap:wrap}
.gm-brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--g-em9);font-size:1.05em}
.gm-brand .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--g-em7),var(--g-em9));color:#fff;font-size:1.1em}
.gm-top .sp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.gm-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:.6em 1.1em;border-radius:11px;font-weight:800;font-size:.92em;transition:.15s;border:1px solid transparent}
.gm-btn.p{background:var(--g-em);color:#fff}
.gm-btn.p:hover{background:var(--g-em7)}
.gm-btn.o{background:#fff;color:var(--g-em9);border-color:var(--g-br)}
.gm-btn.o:hover{background:var(--g-em50);border-color:var(--g-em100)}
.gm-btn.g{background:transparent;color:var(--g-soft);border-color:var(--g-br)}
.gm-btn.g:hover{background:#eef2f6}
.gm-btn:disabled{opacity:.45;cursor:not-allowed}
.gm-btn.sm{padding:.35em .8em;font-size:.82em;border-radius:9px}

.gm-card{background:var(--g-card);border:1px solid var(--g-br);border-radius:16px;padding:18px;
  box-shadow:0 1px 2px rgba(15,23,42,.05)}
.gm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

/* ---- شاشة البداية ---- */
.gm-hero{background:linear-gradient(140deg,#0b5c45,#08402f);color:#fff;border-radius:20px;padding:26px 24px;margin-bottom:18px}
.gm-hero h1{font-size:1.75em;margin-bottom:8px}
.gm-hero p{margin:0;color:#bfe9d8;font-size:.95em;line-height:1.9;max-width:58ch}
.gm-modes{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.gm-mode{padding:.55em 1.15em;border-radius:999px;font-weight:800;font-size:.88em;transition:.15s;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#ecfdf5}
.gm-mode:hover{background:rgba(255,255,255,.24)}
.gm-mode.on{background:#fff;color:var(--g-em9);border-color:#fff}

.gm-pick{background:var(--g-card);border:1px solid var(--g-br);border-radius:16px;padding:18px;
  display:flex;flex-direction:column;gap:9px;transition:.18s;text-align:right;position:relative;overflow:hidden}
.gm-pick:hover{border-color:var(--g-em100);box-shadow:0 8px 24px rgba(15,23,42,.09);transform:translateY(-2px)}
.gm-pick .em{font-size:1.7em;line-height:1}
.gm-pick h3{font-size:1.05em;color:var(--g-em9)}
.gm-pick p{margin:0;font-size:.85em;color:var(--g-muted);line-height:1.8}
.gm-pick .best{font-size:.78em;color:var(--g-em7);font-weight:800}
.gm-pick .tag{position:absolute;inset-inline-end:14px;top:14px;font-size:.72em;font-weight:800;
  padding:2px 9px;border-radius:999px;background:var(--g-em50);color:var(--g-em7);border:1px solid var(--g-em100)}

/* ---- شريط الحالة أثناء اللعب ---- */
.gm-hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.gm-stat{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--g-br);
  border-radius:11px;padding:.45em .85em;font-size:.85em;font-weight:800;color:var(--g-soft)}
.gm-stat b{color:var(--g-em9);font-size:1.1em}
.gm-stat.warn b{color:var(--g-red)}
.gm-timer{flex:1 1 160px;min-width:120px;height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden}
.gm-timer i{display:block;height:100%;background:var(--g-em);transition:width .25s linear}
.gm-timer.low i{background:#dc2626}
.gm-lives{letter-spacing:2px;font-size:1em}

/* ---- لعبة الفرز ---- */
.gm-item{background:#fff;border:2px solid var(--g-br);border-radius:18px;padding:30px 24px;text-align:center;
  min-height:150px;display:grid;place-items:center;font-size:1.25em;font-weight:800;color:var(--g-ink);line-height:1.7}
.gm-item.ok{border-color:var(--g-em);background:var(--g-em50)}
.gm-item.no{border-color:var(--g-red-br);background:var(--g-red50)}
.gm-sortbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}
.gm-sortbtns button{padding:1em .6em;border-radius:14px;font-weight:900;font-size:1em;border:2px solid #cbd5e1;
  background:#fff;color:var(--g-ink);transition:.14s;line-height:1.5}
.gm-sortbtns button:disabled{color:var(--g-muted)}
.gm-sortbtns button span{display:block;font-size:.72em;font-weight:600;color:var(--g-muted);margin-top:2px}
.gm-sortbtns button:hover:not(:disabled){border-color:var(--g-em);background:var(--g-em50)}
.gm-sortbtns button.sb-f,.gm-sortbtns button.fn-p{border-color:#c7d2fe}
.gm-sortbtns button.sb-f:hover:not(:disabled),.gm-sortbtns button.fn-p:hover:not(:disabled){background:#eef2ff;border-color:#6366f1}
.gm-sortbtns button.sb-v,.gm-sortbtns button.fn-s{border-color:#fbcfe8}
.gm-sortbtns button.sb-v:hover:not(:disabled),.gm-sortbtns button.fn-s:hover:not(:disabled){background:#fdf2f8;border-color:#db2777}
.gm-sortbtns button.sb-m,.gm-sortbtns button.fn-a{border-color:#fde68a}
.gm-sortbtns button.sb-m:hover:not(:disabled),.gm-sortbtns button.fn-a:hover:not(:disabled){background:#fffbeb;border-color:#d97706}
.gm-sortbtns button.right{background:var(--g-em50);border-color:var(--g-em);color:var(--g-em9)}
.gm-sortbtns button.wrong{background:var(--g-red50);border-color:var(--g-red-br);color:var(--g-red)}

.gm-fb{margin-top:13px;border-radius:13px;padding:12px 15px;font-size:.9em;line-height:1.85;border:1px solid}
.gm-fb.ok{background:var(--g-em50);border-color:var(--g-em100);color:#134e4a}
.gm-fb.no{background:var(--g-red50);border-color:var(--g-red-br);color:var(--g-red)}
.gm-fb.info{background:var(--g-blue50);border-color:var(--g-blue-br);color:#1e3a8a}
.gm-fb b{font-weight:900}
.gm-combo{display:inline-block;background:var(--g-amber50);border:1px solid var(--g-amber-br);color:var(--g-amber);
  border-radius:999px;padding:2px 11px;font-size:.8em;font-weight:900;margin-inline-start:8px}

/* ---- الخطوات (أعلى وأدنى) ---- */
.gm-steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.gm-step{flex:1 1 120px;text-align:center;padding:.5em;border-radius:10px;font-size:.8em;font-weight:800;
  background:#fff;border:1px solid var(--g-br);color:var(--g-muted)}
.gm-step.on{background:var(--g-em);border-color:var(--g-em);color:#fff}
.gm-step.done{background:var(--g-em50);border-color:var(--g-em100);color:var(--g-em7)}
.gm-tbl{width:100%;border-collapse:collapse;font-size:.92em;margin:12px 0}
.gm-tbl th{background:var(--g-em);color:#fff;padding:.6em .8em;text-align:center;font-weight:800}
.gm-tbl td{padding:.55em .8em;border-bottom:1px solid var(--g-br);text-align:center}
.gm-tbl tr:last-child td{border-bottom:0}
.gm-tbl tr.hi td{background:#dcfce7;font-weight:800}
.gm-tbl tr.lo td{background:#dbeafe;font-weight:800}
.gm-tbl tr.pick{cursor:pointer}
.gm-tbl tr.pick:hover td{background:var(--g-em50)}
.gm-tbl tr.sel td{background:#fef9c3;font-weight:800}
.gm-num{width:100%;max-width:230px;padding:.6em .9em;border:2px solid var(--g-br);border-radius:12px;
  font-size:1.05em;font-weight:800;text-align:center;direction:ltr;outline:none;transition:.14s}
.gm-num:focus{border-color:var(--g-em);box-shadow:0 0 0 3px var(--g-em50)}
.gm-eq{background:#0f172a;color:#a7f3d0;border-radius:12px;padding:12px 16px;text-align:center;
  font-weight:800;font-size:1.05em;margin:12px 0;direction:rtl}
.gm-hint{font-size:.85em;color:var(--g-muted);margin-top:7px;line-height:1.8}
.gm-work{background:#f8fafc;border:1px solid var(--g-br);border-radius:12px;padding:12px 15px;margin-top:11px;
  font-size:.88em;line-height:2;color:var(--g-soft)}
.gm-work b{color:var(--g-em7)}

/* ---- الرسوم ---- */
.gm-chart{background:#fff;border:1px solid var(--g-br);border-radius:14px;padding:10px;display:grid;place-items:center}
.gm-chart svg{width:100%;height:auto;max-width:520px;display:block}
.gm-chart.mini svg{max-width:210px}
.gm-chart.mini{cursor:pointer;transition:.15s;border-width:2px}
.gm-chart.mini:hover{border-color:var(--g-em);background:var(--g-em50)}
.gm-chart.mini.right{border-color:var(--g-em);background:var(--g-em50)}
.gm-chart.mini.wrong{border-color:var(--g-red-br);background:var(--g-red50)}
.gm-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.gm-opt{width:100%;text-align:right;padding:.7em 1em;border-radius:12px;border:2px solid #cbd5e1;
  background:#fff;font-size:.95em;font-weight:700;color:var(--g-soft);transition:.14s;display:flex;gap:9px;align-items:flex-start}
.gm-opt:hover:not(:disabled){border-color:var(--g-em);background:var(--g-em50)}
.gm-opt .l{flex:0 0 auto;font-weight:900;color:var(--g-muted)}
.gm-opt.right{background:var(--g-em50);border-color:var(--g-em);color:var(--g-em9)}
.gm-opt.wrong{background:var(--g-red50);border-color:var(--g-red-br);color:var(--g-red)}
.gm-opt:disabled{cursor:default;color:var(--g-muted)}
.gm-opt.right:disabled{color:var(--g-em9)}
.gm-opt.wrong:disabled{color:var(--g-red)}

/* ---- الفرق ---- */
.gm-teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.gm-team{background:#fff;border:2px solid var(--g-br);border-radius:14px;padding:12px;text-align:center;transition:.15s}
.gm-team.turn{border-color:var(--g-em);background:var(--g-em50);box-shadow:0 6px 18px rgba(5,150,105,.16)}
.gm-team .nm{font-weight:900;font-size:.95em;color:var(--g-ink)}
.gm-team .sc{font-size:1.6em;font-weight:900;color:var(--g-em7);line-height:1.3}
.gm-team .badge{font-size:.72em;font-weight:800;color:var(--g-em);display:block}
.gm-turnbar{background:var(--g-em9);color:#fff;border-radius:13px;padding:.7em 1.2em;text-align:center;
  font-weight:900;font-size:1.05em;margin-bottom:14px}

/* ---- النتائج ---- */
.gm-final{text-align:center;padding:12px 0}
.gm-final .big{font-size:3.2em;font-weight:900;color:var(--g-em7);line-height:1.2}
.gm-final .sub{color:var(--g-muted);font-size:.95em}
.gm-medal{font-size:3em;line-height:1}
.gm-bars{margin-top:16px;text-align:right}
.gm-bar{margin-bottom:9px}
.gm-bar .lb{display:flex;justify-content:space-between;font-size:.85em;font-weight:700;color:var(--g-soft);margin-bottom:3px}
.gm-bar .tr{height:9px;border-radius:999px;background:#e2e8f0;overflow:hidden}
.gm-bar .tr i{display:block;height:100%;background:var(--g-em);border-radius:999px}
.gm-bar.low .tr i{background:#dc2626}
.gm-bar.mid .tr i{background:#d97706}
.gm-review{margin-top:16px;text-align:right}
.gm-review .it{border-top:1px solid var(--g-br);padding:10px 0;font-size:.88em;line-height:1.85}
.gm-review .it:first-child{border-top:0}
.gm-review .it b{color:var(--g-red)}

.gm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .gm-wrap{padding:14px 13px 70px}
  .gm-hero{padding:20px 17px}
  .gm-hero h1{font-size:1.4em}
  .gm-sortbtns{grid-template-columns:1fr}
  .gm-item{font-size:1.1em;padding:22px 16px;min-height:120px}
  .gm.big{--g-scale:1.06}
}


/* ---- أصناف مضافة للنسخة متعددة الوحدات ---- */
.gm-h{font-size:1.1em;margin:6px 0 12px;font-weight:900;color:var(--g-ink)}
.gm-q{font-size:1.03em;line-height:1.9;margin:0 0 13px;font-weight:800;color:var(--g-ink)}
.gm-actions{margin-top:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gm-actions.gm-center{justify-content:center}
.gm-center{text-align:center}
.gm-lbl{font-size:.85em;color:var(--g-muted)}
.gm-sub2{margin-top:10px;font-size:.9em;color:var(--g-muted)}
.gm-win{font-size:1.5em;margin:6px 0}
.gm-tname{max-width:100%;font-size:.9em;padding:.45em .6em}
.gm-count{font-size:.78em;font-weight:800;color:var(--g-em7)}
.gm-back{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gm-unitname{font-size:.9em;font-weight:800;color:var(--g-em9)}
.gm-pick.mix{background:linear-gradient(150deg,#f5f3ff,#ede9fe);border-color:#ddd6fe}
.gm-pick.mix h3{color:#5b21b6}
.gm-pick.mix:hover{border-color:#a78bfa}
.gm-item-sm{min-height:96px;font-size:1.12em}
.gm-review .wy{color:var(--g-muted)}

/* مصفوفة التبويب 3×2 */
.gm-matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:9px;margin-top:14px;align-items:stretch}
.gm-mh{display:grid;place-items:center;font-size:.85em;font-weight:900;color:var(--g-em9);padding:4px}
.gm-mr{display:grid;place-items:center;font-size:.95em;font-weight:900;color:var(--g-ink);
  background:#f1f5f9;border-radius:11px;padding:6px 12px;min-width:74px}
.gm-cell{padding:1em .7em;border-radius:13px;border:2px solid #cbd5e1;background:#fff;color:var(--g-ink);
  font-weight:800;font-size:.95em;transition:.14s;line-height:1.5}
.gm-cell:disabled{color:var(--g-muted)}
.gm-cell:hover:not(:disabled){border-color:var(--g-em);background:var(--g-em50)}
.gm-cell.c-mat{border-color:#bfdbfe} .gm-cell.c-mat:hover:not(:disabled){background:#eff6ff;border-color:#3b82f6}
.gm-cell.c-lab{border-color:#fbcfe8} .gm-cell.c-lab:hover:not(:disabled){background:#fdf2f8;border-color:#db2777}
.gm-cell.c-srv{border-color:#fde68a} .gm-cell.c-srv:hover:not(:disabled){background:#fffbeb;border-color:#d97706}
.gm-cell.right{background:var(--g-em50);border-color:var(--g-em);color:var(--g-em9)}
.gm-cell.wrong{background:var(--g-red50);border-color:var(--g-red-br);color:var(--g-red)}

/* ترتيب بنود القائمة */
.gm-order{display:flex;flex-direction:column;gap:6px;margin:12px 0;min-height:60px}
.gm-oline{display:flex;align-items:center;gap:9px;background:#fff;border:2px solid var(--g-br);
  border-radius:11px;padding:.55em .9em;font-size:.93em;font-weight:700}
.gm-oline.right{border-color:var(--g-em);background:var(--g-em50)}
.gm-oline.wrong{border-color:var(--g-red-br);background:var(--g-red50)}
.gm-oline .nn{flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--g-em);color:#fff;
  display:grid;place-items:center;font-size:.8em;font-weight:900}
.gm-empty{color:var(--g-muted);font-size:.88em;padding:14px;text-align:center;
  border:2px dashed var(--g-br);border-radius:12px}
.gm-pool{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.gm-chipbtn{padding:.5em .9em;border-radius:999px;border:2px solid #cbd5e1;background:#fff;
  font-size:.88em;font-weight:700;color:var(--g-soft);transition:.14s}
.gm-chipbtn:disabled{opacity:.5}
.gm-chipbtn:hover:not(:disabled){border-color:var(--g-em);background:var(--g-em50);color:var(--g-em9)}
@media (max-width:640px){
  .gm-matrix{grid-template-columns:auto 1fr 1fr;gap:6px}
  .gm-cell{font-size:.82em;padding:.8em .4em}
  .gm-mr{font-size:.85em;padding:4px 7px;min-width:56px}
}

  {t:"قسط استهلاك الآلات بطريقة القسط الثابت", k:"f", why:"القسط محسوب على أساس الزمن لا على أساس الإنتاج، فيبقى ثابتاً كل فترة."},

  {t:"أجور العمال المحسوبة بالقطعة", k:"v", why:"الأجر يُدفع عن كل وحدة منتجة، فيتحرك طردياً مع الإنتاج."},

  {t:"عمولة البيع كنسبة من قيمة المبيعات", k:"v", why:"العمولة نسبة مئوية، فتزيد وتنقص مع حجم المبيعات."},
  {t:"تكلفة شحن المنتج للعميل عن كل وحدة", k:"v", why:"تُدفع عن كل وحدة مشحونة، وتنعدم إذا لم تُشحن وحدات."},
  {t:"الخيوط والأزرار في مصنع ملابس", k:"v", why:"مواد مباشرة تدخل في كل قطعة، فتزيد بزيادة القطع."},
  {t:"تكلفة الزجاجات في مصنع مياه", k:"v", why:"زجاجة لكل وحدة منتجة، فالتكلفة الإجمالية تتناسب طردياً مع الإنتاج."},
  {t:"وقود يُستهلك بمقدار محدد لكل ساعة تشغيل", k:"v", why:"الاستهلاك مرتبط مباشرة بمستوى التشغيل بلا جزء ثابت."},
  {t:"رسم استخدام قالب يُدفع عن كل وحدة منتجة", k:"v", why:"رسم لكل وحدة، فينعدم عند توقف الإنتاج."},
  {t:"مخصص تكلفة الضمان لكل وحدة مباعة", k:"v", why:"يُحمَّل بمبلغ محدد عن كل وحدة، فيتغير بتغير عدد الوحدات."},

  const it=g.deck[g.i], ok=it.k===k; g.picked=k; mark(ok);
  if(ok){ g.streak++; g.bestStreak=Math.max(g.bestStreak,g.streak);
    const mult=g.streak>=8?3:g.streak>=4?2:1; addScore(10*mult);
    g.fb={ok:true,mult,why:it.why,cat:CATS[it.k]};
  }else{ g.streak=0; g.lives--; g.fb={ok:false,why:it.why,cat:CATS[it.k]};
    logErr(it.t,CATS[it.k],CATS[k],it.why); }
  draw();
}
function sortNext(){
  const g=S.g; g.fb=null; g.picked=null;
  if(advance()) return;
  g.i++;
  if(g.lives<=0) return finish();
  if(g.i>=g.deck.length){ g.deck=sh(GM_ITEMS); g.i=0; }
  draw();
}
function sortView(){
  const g=S.g, it=g.deck[g.i];
  const btn=k=>{ let c="sb-"+k; if(g.fb){ if(k===it.k) c+=" right"; else if(k===g.picked) c+=" wrong"; }
    return `<button class="${c}" ${g.fb?"disabled":""} onclick="GM.sortAnswer('${k}')">${CATS[k]}<span>${CATSUB[k]}</span></button>`; };
  return `${hud(["📦 "+(g.i+1)])}
    <div class="gm-item ${g.fb?(g.fb.ok?"ok":"no"):""}">${E(it.t)}</div>
    <div class="gm-sortbtns">${btn("f")}${btn("v")}${btn("m")}</div>
    ${g.fb?`<div class="gm-fb ${g.fb.ok?"ok":"no"}">
      <b>${g.fb.ok?"إجابة صحيحة":"إجابة غير صحيحة"} — التصنيف الصحيح: ${g.fb.cat}</b>
      ${g.fb.ok&&g.fb.mult>1?`<span class="gm-combo">×${g.fb.mult} سلسلة ${g.streak}</span>`:""}
      <div>${E(g.fb.why)}</div></div>${nextBtn("GM.sortNext()")}`:""}`;
}

   و٢ – ٢) اقرأ الرسم البياني

function chartSvg(type,mini){
  const x0=52,x1=384,y0=208,y1=14;
  const ax=`<line x1="${x0}" y1="${y1}" x2="${x0}" y2="${y0}" stroke="#94a3b8" stroke-width="1.6"/>
            <line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#94a3b8" stroke-width="1.6"/>`;
  const lab=`<text x="${(x0+x1)/2}" y="240" text-anchor="middle" font-size="13" fill="#64748b">حجم الإنتاج (س)</text>
             <text x="14" y="111" text-anchor="middle" font-size="13" fill="#64748b" transform="rotate(-90 14 111)">التكلفة (ص)</text>`;
  const grid=[.25,.5,.75].map(p=>`<line x1="${x0}" y1="${y0-(y0-y1)*p}" x2="${x1}" y2="${y0-(y0-y1)*p}" stroke="#eef2f6"/>`).join("");
  const C="#047857"; const ltr='style="direction:ltr;unicode-bidi:isolate"'; let body="";
  if(type==="fixed_total"){ const y=y0-(y0-y1)*.55;
    body=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C}" stroke-width="3.2"/>
          <text x="${x1-6}" y="${y-9}" text-anchor="end" font-size="12" fill="${C}" font-weight="700" ${ltr}>5,000</text>`;
  } else if(type==="fixed_unit"){ let d="";
    for(let i=0;i<=60;i++){ const t=i/60,X=x0+(x1-x0)*(.08+t*.92),v=1/(.10+t*.95),Y=y0-(y0-y1)*(v/10.2);
      d+=(i?"L":"M")+X.toFixed(1)+" "+Math.max(y1,Y).toFixed(1)+" "; }
    body=`<path d="${d}" fill="none" stroke="${C}" stroke-width="3.2"/>`;
  } else if(type==="var_total"){
    body=`<line x1="${x0}" y1="${y0}" x2="${x1-6}" y2="${y1+18}" stroke="${C}" stroke-width="3.2"/><circle cx="${x0}" cy="${y0}" r="4" fill="${C}"/>`;
  } else if(type==="var_unit"){ const y=y0-(y0-y1)*.5;
    body=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${C}" stroke-width="3.2"/>
          <text x="${x1-6}" y="${y-9}" text-anchor="end" font-size="12" fill="${C}" font-weight="700" ${ltr}>100</text>`;
  } else if(type==="mixed_total"){ const yi=y0-(y0-y1)*.24;
    body=`<line x1="${x0}" y1="${yi}" x2="${x1-6}" y2="${y1+16}" stroke="${C}" stroke-width="3.2"/>
          <line x1="${x0}" y1="${yi}" x2="${x1}" y2="${yi}" stroke="#cbd5e1" stroke-dasharray="5 4"/>
          <circle cx="${x0}" cy="${yi}" r="4.5" fill="${C}"/><text x="${x0+9}" y="${yi-9}" font-size="12" fill="${C}" font-weight="700">أ</text>`;
  } else if(type==="scatter"){
    const pts=[[.10,.34],[.22,.40],[.33,.46],[.40,.60],[.52,.55],[.63,.70],[.72,.66],[.84,.80],[.93,.86]];
    body=pts.map(p=>`<circle cx="${x0+(x1-x0)*p[0]}" cy="${y0-(y0-y1)*p[1]}" r="4" fill="#059669" opacity=".85"/>`).join("")
      +`<line x1="${x0}" y1="${y0-(y0-y1)*.28}" x2="${x1-8}" y2="${y1+30}" stroke="#0f172a" stroke-width="2.4"/>
        <circle cx="${x0}" cy="${y0-(y0-y1)*.28}" r="4.5" fill="#0f172a"/>`;
  }
  return `<svg viewBox="0 0 400 250" role="img">${grid}${ax}${mini?"":lab}${body}</svg>`;
}
function chartQs(){
  const qs=[], labelOf={}; GM_CHARTS.forEach(x=>labelOf[x.type]=x.label);
  GM_CHARTS.forEach(c=>{
    const others=sh(GM_CHARTS.filter(x=>x.type!==c.type)).slice(0,3);
    qs.push({kind:"naming", type:c.type, q:"ما الذي يمثّله هذا الرسم البياني؟",
      opts:sh([c].concat(others)).map(x=>x.label), ans:c.label, why:c.why});
    qs.push({kind:"finding", q:"أي رسم من التالي يمثّل: "+c.label+"؟",
      grid:sh([c].concat(others)).map(x=>x.type), ans:c.type, labelOf, why:c.why});
  });
  GM_CONCEPTS.forEach(k=> qs.push({kind:"concept", q:k.q, opts:k.o.slice(), ans:k.o[k.c], why:k.why}));
  return qs;
}
function chartsStart(one){
  const all=sh(chartQs());
  S.g={ qs: one?[all[0]] : all.slice(0, S.mode==="teams"?S.teamQ:10), i:0, score:0,right:0,wrong:0, fb:null, picked:null };
}
function chartsAnswer(v){
  const g=S.g; if(g.fb) return;
  const q=g.qs[g.i], ok=v===q.ans; g.picked=v; mark(ok);
  const show=x=> (q.labelOf&&q.labelOf[x]) ? q.labelOf[x] : x;
  if(ok) addScore(15); else logErr(q.q, show(q.ans), show(v), q.why);
  g.fb={ok, why:q.why, ans:show(q.ans)}; draw();
}
function chartsNext(){
  const g=S.g; g.fb=null; g.picked=null;
  if(advance()) return;
  g.i++; if(g.i>=g.qs.length) return finish();
  draw();
}
function chartsView(){
  const g=S.g,q=g.qs[g.i]; let body="";
  if(q.kind==="finding"){
    body=`<div class="gm-grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      ${q.grid.map(t=>{ let c="gm-chart mini";
        if(g.fb){ if(t===q.ans) c+=" right"; else if(t===g.picked) c+=" wrong"; }
        return `<div class="${c}" onclick="${g.fb?"":`GM.chartsAnswer('${t}')`}">${chartSvg(t,true)}</div>`; }).join("")}</div>`;
  } else {
    if(q.kind==="naming") body+=`<div class="gm-chart">${chartSvg(q.type,false)}</div>`;
    body+=opts(q.opts,g.fb,q.ans,g.picked,"GM.chartsAnswer");
  }
  return `${hud(["❓ "+(g.i+1)+(S.mixed?"":" / "+g.qs.length)])}
    <div class="gm-card"><h3 class="gm-q">${E(q.q)}</h3>${body}
    ${g.fb?fbBox(g.fb.ok,g.fb.ans,g.fb.why)+nextBtn("GM.chartsNext()"):""}</div>`;
}

/* ============================================================
   و٢ – ٣) تحدي أعلى وأدنى مستوى
   ============================================================ */
function makeHL(){
  const b=pick([10,12,15,16,20,24,25,30]);
  const a=pick([8000,10000,12000,15000,18000,20000,21000,24000,25000,30000]);
  const base=pick([1500,2000,2250,2500]); const set=new Set();
  while(set.size<6) set.add(base+50*Math.floor(Math.random()*31));
  const xs=Array.from(set).sort((p,q)=>p-q);
  const lo=xs[0], hi=xs[xs.length-1], loC=a+b*lo, hiC=a+b*hi;
  const rows=xs.map(x=>{ let c=a+b*x;
    if(x!==lo&&x!==hi){ const nz=(Math.random()<.5?-1:1)*1000*(3+Math.floor(Math.random()*8));
      c=Math.min(hiC-1000,Math.max(loC+1000,c+nz)); }
    return {x,c}; });
  const mid=rows.filter(r=>r.x!==lo&&r.x!==hi);
  if(mid.length&&Math.random()<.45) pick(mid).c = hiC+1000*(2+Math.floor(Math.random()*7));
  const mid2=rows.filter(r=>r.x!==lo&&r.x!==hi&&r.c<=hiC);
  if(mid2.length&&Math.random()<.35){ const r=pick(mid2); r.c=Math.max(1000, loC-1000*(2+Math.floor(Math.random()*6))); }
  const newX=hi+50*(6+Math.floor(Math.random()*13));
  return { a,b,rows:sh(rows),lo,hi,loC,hiC,newX, pred:a+b*newX,
           unit:pick([["ساعة تشغيل الآلات","تكاليف الصيانة"],["ساعة عمل مباشرة","التكاليف الصناعية غير المباشرة"],["وحدة منتجة","تكاليف الكهرباء"]]) };
}
function hlStart(){ S.g={p:makeHL(), step:0, sel:[], val:"", fb:null, score:0,right:0,wrong:0, solved:0, target:S.mode==="teams"?1:3}; }
function hlPickRow(i){ const g=S.g; if(g.step!==0||g.fb) return;
  const k=g.sel.indexOf(i); if(k>=0) g.sel.splice(k,1); else if(g.sel.length<2) g.sel.push(i); draw(); }
function hlInput(v){ S.g.val=v; }
function hlCheck(){
  const g=S.g,p=g.p;
  if(g.step===0){
    if(g.sel.length!==2){ g.fb={ok:false,msg:"اختر صفّين: أعلى مستوى نشاط وأدنى مستوى نشاط."}; return draw(); }
    const xs=g.sel.map(i=>p.rows[i].x).sort((m,n)=>m-n);
    const ok=xs[0]===p.lo&&xs[1]===p.hi; mark(ok); if(ok) addScore(10);
    const maxC=Math.max.apply(null,p.rows.map(r=>r.c));
    if(!ok) logErr("تحديد أعلى وأدنى مستوى نشاط", N(p.hi)+" و "+N(p.lo), N(xs[1])+" و "+N(xs[0]),
                   "الاختيار على أساس مستوى النشاط لا على أساس التكلفة.");
    g.fb={ok, msg: ok?"الاختيار يعتمد على <b>مستوى النشاط</b> لا على قيمة التكلفة."
                    :"الاختيار يكون على أساس <b>مستوى النشاط</b> لا على أعلى تكلفة أو أدناها.",
      work:`أعلى مستوى نشاط = <b>${N(p.hi)}</b> وتكلفته ${N(p.hiC)} ريال<br>
            أدنى مستوى نشاط = <b>${N(p.lo)}</b> وتكلفته ${N(p.loC)} ريال`
        +(maxC>p.hiC?`<br>⚠ لاحظ أن أعلى <b>تكلفة</b> في الجدول (${N(maxC)}) ليست عند أعلى نشاط — ولهذا لا يصح الاختيار على أساس التكلفة.`:"") };
    return draw();
  }
  const v=parseFloat(String(g.val).replace(/[,\s]/g,""));
  if(isNaN(v)){ g.fb={ok:false,msg:"اكتب رقماً."}; return draw(); }
  const sp=[null,
    {t:p.b, pts:15, lab:"التكلفة المتغيرة للوحدة (ب)", u:"ريال للوحدة",
     w:`ب = (${N(p.hiC)} − ${N(p.loC)}) ÷ (${N(p.hi)} − ${N(p.lo)}) = ${N(p.hiC-p.loC)} ÷ ${N(p.hi-p.lo)} = <b>${N(p.b)}</b>`},
    {t:p.a, pts:15, lab:"الجزء الثابت (أ)", u:"ريال",
     w:`بالتعويض عند أعلى مستوى: ${N(p.hiC)} = أ + ${N(p.b)} × ${N(p.hi)}<br>أ = ${N(p.hiC)} − ${N(p.b*p.hi)} = <b>${N(p.a)}</b>`},
    {t:p.pred, pts:20, lab:"التكلفة المتوقعة", u:"ريال",
     w:`ص = ${N(p.a)} + ${N(p.b)} × ${N(p.newX)} = <b>${N(p.pred)}</b> ريال`}
  ][g.step];
  const ok=Math.abs(v-sp.t)<0.5; mark(ok); if(ok) addScore(sp.pts);
  if(!ok) logErr(sp.lab, N(sp.t)+" "+sp.u, N(v), sp.w.replace(/<[^>]+>/g,""));
  g.fb={ok, msg: ok?"":`الإجابة النموذجية: ${N(sp.t)} ${sp.u}.`, work:sp.w};
  draw();
}
function hlNext(){
  const g=S.g; g.fb=null; g.val=""; g.step++;
  if(g.step>3){
    g.solved++; g.step=0; g.sel=[];
    if(S.mode==="teams"){ nextTurn(); if(S.qDone>=S.teamQ) return finish(); }
    else if(g.solved>=g.target) return finish();
    g.p=makeHL();
  }
  draw();
}
function hlView(){
  const g=S.g,p=g.p,st=g.step;

    ${p.rows.map((r,i)=>{ const c = st===0 ? "pick"+(g.sel.includes(i)?" sel":"") : (r.x===p.hi?"hi":r.x===p.lo?"lo":"");

    </tbody></table>`;
  const asks=[
    ["اضغط على صفّ أعلى مستوى نشاط وصفّ أدنى مستوى نشاط.","تذكّر: المقارنة على أساس مستوى النشاط، لا على أساس أعلى تكلفة أو أدناها."],
    ["احسب التكلفة المتغيرة للوحدة (ب) بالريال.","ب = (تكاليف أعلى مستوى − تكاليف أدنى مستوى) ÷ (أعلى نشاط − أدنى نشاط)"],
    ["احسب الجزء الثابت (أ) بالريال.",`عوّض في ص = أ + ب س عند أي من المستويين. مثلاً: ${N(p.hiC)} = أ + ${N(p.b)} × ${N(p.hi)}`],
    [`كم تتوقع أن تبلغ التكلفة عند مستوى نشاط ${N(p.newX)}؟`,`استخدم المعادلة التي توصّلت إليها: ص = ${N(p.a)} + ${N(p.b)} س`]
  ][st];
  return `${hud([S.mode==="teams"?"🧮 مسألة":"🧮 مسألة "+(g.solved+1)+" / "+g.target])}
    <div class="gm-steps">${names.map((n,i)=>`<div class="gm-step ${i===st?"on":i<st?"done":""}">${i+1}. ${n}</div>`).join("")}</div>
    <div class="gm-card">
      <div class="gm-eq">ص = أ + ب س</div>${tbl}
      ${st>=2?`<div class="gm-eq">ب = ${N(p.b)} ريال / ${E(p.unit[0])}${st>=3?` &nbsp;·&nbsp; أ = ${N(p.a)} ريال`:""}</div>`:""}
      <p class="gm-q">${E(asks[0])}</p>
      ${st>0?`<input class="gm-num" inputmode="decimal" placeholder="اكتب الرقم" value="${E(g.val)}"
        oninput="GM.hlInput(this.value)" onkeydown="if(event.key==='Enter')GM.hlCheck()" ${g.fb?"disabled":""}>`:""}
      <div class="gm-hint">💡 ${E(asks[1])}</div>
      ${g.fb?`<div class="gm-fb ${g.fb.ok?"ok":"no"}"><b>${g.fb.ok?"إجابة صحيحة":"إجابة غير صحيحة"}</b>${g.fb.msg?`<div>${g.fb.msg}</div>`:""}</div>
        ${g.fb.work?`<div class="gm-work"><b>الحل:</b><br>${g.fb.work}</div>`:""}`:""}
      <div class="gm-actions">${g.fb
        ?`<button class="gm-btn p" onclick="GM.hlNext()">${st>=3?"مسألة جديدة ←":"الخطوة التالية ←"}</button>`

    </div>`;

/* ============================================================
   و٢ – ٤) مصنع تحت إدارتك
   ============================================================ */
function makeRound(){
  let fixed=pick([20000,24000,30000,36000,40000,50000]);
  const vc=pick([10,12,15,20,25,30]), qty=pick([1000,1200,1500,2000,2400,3000]);
  const kind=pick(["total","unit","fixedunit","price","special"]);
  if(kind==="unit"||kind==="price") fixed=Math.max(qty*8, Math.round(fixed/qty)*qty);
  const total=fixed+vc*qty, unit=total/qty;
  if(kind==="total") return {kind,ans:total,unitTxt:"ريال",
    q:`مصنعك سينتج ${N(qty)} وحدة هذا الشهر. التكاليف الثابتة ${N(fixed)} ريال، والتكلفة المتغيرة ${N(vc)} ريالاً للوحدة. كم إجمالي التكاليف المتوقعة؟`,
    work:`ص = أ + ب س = ${N(fixed)} + ${N(vc)} × ${N(qty)} = <b>${N(total)}</b> ريال`};
  if(kind==="unit") return {kind,ans:Math.round(unit*100)/100,unitTxt:"ريال/وحدة",
    q:`عند إنتاج ${N(qty)} وحدة، وبتكاليف ثابتة ${N(fixed)} ريال وتكلفة متغيرة ${N(vc)} ريالاً للوحدة، كم تبلغ تكلفة الوحدة الواحدة؟`,
    work:`إجمالي التكاليف = ${N(fixed)} + ${N(vc)} × ${N(qty)} = ${N(total)}<br>تكلفة الوحدة = ${N(total)} ÷ ${N(qty)} = <b>${N(Math.round(unit*100)/100)}</b> ريال`};
  if(kind==="fixedunit"){ const q2=qty*2;
    return {kind:"choice", opts:["يبقى كما هو","ينخفض إلى النصف","يتضاعف","يصبح صفراً"], ans:"ينخفض إلى النصف",
      q:`تكاليفك الثابتة ${N(fixed)} ريال عند إنتاج ${N(qty)} وحدة. إذا رفعت الإنتاج إلى ${N(q2)} وحدة (داخل المدى الملائم)، ماذا يحدث لنصيب الوحدة من التكاليف الثابتة؟`,
      work:`قبل: ${N(fixed)} ÷ ${N(qty)} = ${N(fixed/qty)} ريال/وحدة<br>بعد: ${N(fixed)} ÷ ${N(q2)} = ${N(fixed/q2)} ريال/وحدة<br>الإجمالي الثابت لم يتغير، لكن نصيب الوحدة <b>انخفض إلى النصف</b>.`}; }
  if(kind==="price"){
    const profit=Math.max(qty*5, Math.round(pick([20000,30000,40000,50000])/qty)*qty);
    const price=(total+profit)/qty;
    return {kind,ans:Math.round(price*100)/100,unitTxt:"ريال/وحدة",
      q:`تريد تحقيق ربح قدره ${N(profit)} ريال من بيع ${N(qty)} وحدة. تكاليفك الثابتة ${N(fixed)} ريال والمتغيرة ${N(vc)} ريالاً للوحدة. بكم تبيع الوحدة؟`,
      work:`إجمالي التكاليف = ${N(total)}<br>الإيراد المطلوب = ${N(total)} + ${N(profit)} = ${N(total+profit)}<br>السعر = ${N(total+profit)} ÷ ${N(qty)} = <b>${N(Math.round(price*100)/100)}</b> ريال`}; }
  const off=Math.random()<.5 ? vc+pick([3,5,8]) : vc-pick([2,3,4]); const good=off>vc;
  return {kind:"choice", opts:["أقبل الطلب","أرفض الطلب"], ans:good?"أقبل الطلب":"أرفض الطلب",
    q:`وصلك طلب إضافي بسعر ${N(off)} ريالاً للوحدة، وتكلفتك المتغيرة للوحدة ${N(vc)} ريالاً، وطاقتك الإنتاجية تسمح دون زيادة التكاليف الثابتة. ما القرار الأنسب؟`,
    work: good?`السعر ${N(off)} أعلى من التكلفة المتغيرة ${N(vc)}، فكل وحدة تُسهم بـ <b>${N(off-vc)}</b> ريال في تغطية التكاليف الثابتة وزيادة الربح.`
              :`السعر ${N(off)} أقل من التكلفة المتغيرة ${N(vc)}، فكل وحدة تُباع تزيد الخسارة بـ <b>${N(vc-off)}</b> ريال.`};
}
function facStart(one){ S.g={r:makeRound(), n:0, target: one?1:(S.mode==="teams"?1:6), score:0,right:0,wrong:0, val:"", fb:null, picked:null}; }
function facInput(v){ S.g.val=v; }
function facChoice(v){
  const g=S.g; if(g.fb) return; g.picked=v;
  const ok=v===g.r.ans; mark(ok); if(ok) addScore(20);
  else logErr(g.r.q, g.r.ans, v, g.r.work.replace(/<[^>]+>/g,""));
  g.fb={ok}; draw();

/* ============================================================
   و١ – ٤) ابنِ قائمة تكلفة الإنتاج
   ============================================================ */
function makeStmt(){
  const r=n=>n*1000;
  const matOpen=r(pick([10,15,20,25])), matBuy=r(pick([60,80,100,120,140])), matClose=r(pick([8,12,18,22]));
  const matUsed=matOpen+matBuy-matClose;
  const dl=r(pick([40,50,60,70,80])), moh=r(pick([30,35,45,55,65]));
  const totalMfg=matUsed+dl+moh;
  const wipOpen=r(pick([5,8,10,14])), wipClose=r(pick([4,7,11,16]));
  const finished=totalMfg+wipOpen-wipClose;
  const fgOpen=r(pick([12,18,25,30])), fgClose=r(pick([10,16,22,28]));
  const cogs=finished+fgOpen-fgClose;
  const sales=cogs+r(pick([60,80,100,130,160]));
  return {matOpen,matBuy,matClose,matUsed,dl,moh,totalMfg,wipOpen,wipClose,finished,fgOpen,fgClose,cogs,sales,gross:sales-cogs};
}
function stmtStart(){
  S.g={ phase:0, order:[], pool:sh(GM_STMT_LINES.map((x,i)=>({i,t:x.t}))), fb:null,
        d:makeStmt(), step:0, val:"", score:0,right:0,wrong:0, target:S.mode==="teams"?3:5 };
}
function stmtPick(i){
  const g=S.g; if(g.fb) return;
  const k=g.pool.findIndex(x=>x.i===i); if(k<0) return;
  g.order.push(g.pool[k]); g.pool.splice(k,1); draw();
}
function stmtUndo(){ const g=S.g; if(g.fb||!g.order.length) return; g.pool.push(g.order.pop()); draw(); }
function stmtCheckOrder(){
  const g=S.g;
  if(g.order.length!==GM_STMT_LINES.length){ g.fb=null; g.warn="رتّب كل البنود أولاً."; return draw(); }
  g.warn=null;
  const ok=g.order.every((x,i)=>x.i===i); mark(ok); if(ok) addScore(25);
  else logErr("ترتيب بنود قائمة تكلفة الإنتاج", GM_STMT_LINES.map(x=>x.t).join(" ← "), g.order.map(x=>x.t).join(" ← "),
              "التسلسل: المواد ثم الأجور ثم ت.ص.غ.م = إجمالي التصنيع، ثم تسوية مخزون تحت التشغيل.");
  g.fb={ok, work:GM_STMT_LINES.map((x,i)=>`${i+1}. ${x.t}`).join("<br>")};
  draw();
}
function stmtInput(v){ S.g.val=v; }
function stmtSpecs(){
  const d=S.g.d;
  return [
   {lab:"المواد المباشرة المستخدمة", ans:d.matUsed, pts:15,
    q:`مخزون مواد أول المدة ${N(d.matOpen)} ريال، والمشتريات ${N(d.matBuy)} ريال، ومخزون مواد آخر المدة ${N(d.matClose)} ريال. كم المواد المباشرة المستخدمة؟`,
    w:`${N(d.matOpen)} + ${N(d.matBuy)} − ${N(d.matClose)} = <b>${N(d.matUsed)}</b> ريال`},
   {lab:"إجمالي تكاليف التصنيع", ans:d.totalMfg, pts:15,
    q:`المواد المباشرة المستخدمة ${N(d.matUsed)} ريال، والأجور المباشرة ${N(d.dl)} ريال، والتكاليف الصناعية غير المباشرة ${N(d.moh)} ريال. كم إجمالي تكاليف التصنيع؟`,
    w:`${N(d.matUsed)} + ${N(d.dl)} + ${N(d.moh)} = <b>${N(d.totalMfg)}</b> ريال`},
   {lab:"تكلفة الإنتاج التام", ans:d.finished, pts:20,
    q:`إجمالي تكاليف التصنيع ${N(d.totalMfg)} ريال، ومخزون إنتاج تحت التشغيل أول المدة ${N(d.wipOpen)} ريال وآخر المدة ${N(d.wipClose)} ريال. كم تكلفة الإنتاج التام خلال الفترة؟`,
    w:`${N(d.totalMfg)} + ${N(d.wipOpen)} − ${N(d.wipClose)} = <b>${N(d.finished)}</b> ريال`},
   {lab:"تكلفة البضاعة المباعة", ans:d.cogs, pts:20,
    q:`تكلفة الإنتاج التام ${N(d.finished)} ريال، ومخزون إنتاج تام أول المدة ${N(d.fgOpen)} ريال وآخر المدة ${N(d.fgClose)} ريال. كم تكلفة البضاعة المباعة؟`,
    w:`${N(d.finished)} + ${N(d.fgOpen)} − ${N(d.fgClose)} = <b>${N(d.cogs)}</b> ريال`},
   {lab:"مجمل الربح", ans:d.gross, pts:20,
    q:`المبيعات ${N(d.sales)} ريال وتكلفة البضاعة المباعة ${N(d.cogs)} ريال. كم مجمل الربح؟`,
    w:`${N(d.sales)} − ${N(d.cogs)} = <b>${N(d.gross)}</b> ريال`}
  ];
}
function stmtCheck(){
  const g=S.g, sp=stmtSpecs()[g.step];
  const v=parseFloat(String(g.val).replace(/[,\s]/g,""));
  if(isNaN(v)){ g.warn="اكتب رقماً."; return draw(); }
  g.warn=null;
  const ok=Math.abs(v-sp.ans)<0.5; mark(ok); if(ok) addScore(sp.pts);
  if(!ok) logErr(sp.lab, N(sp.ans)+" ريال", N(v), sp.w.replace(/<[^>]+>/g,""));
  g.fb={ok, ans:N(sp.ans)+" ريال", work:sp.w};
  draw();
}
function stmtNext(){
  const g=S.g; g.fb=null; g.val=""; g.warn=null;
  if(g.phase===0){ g.phase=1; return draw(); }
  g.step++;
  if(S.mode==="teams"){ nextTurn(); if(S.qDone>=S.teamQ) return finish(); }
  if(g.step>=Math.min(g.target,5)) return finish();
  draw();
}
function stmtView(){
  const g=S.g;
  if(g.phase===0){
    return `${hud(["🧾 المرحلة 1: الترتيب"])}
      <div class="gm-card">
        <h3 class="gm-q">رتّب بنود قائمة تكلفة الإنتاج بالتسلسل الصحيح — اضغط البنود بالترتيب.</h3>
        <div class="gm-order">${g.order.length
          ? g.order.map((x,i)=>{ let c="gm-oline"; if(g.fb) c+=(x.i===i?" right":" wrong");
              return `<div class="${c}"><span class="nn">${i+1}</span>${E(x.t)}</div>`; }).join("")
          : `<div class="gm-empty">لم تختر شيئاً بعد</div>`}</div>
        <div class="gm-pool">${g.pool.map(x=>
          `<button class="gm-chipbtn" ${g.fb?"disabled":""} onclick="GM.stmtPick(${x.i})">${E(x.t)}</button>`).join("")}</div>
        ${g.warn?`<div class="gm-fb no">${E(g.warn)}</div>`:""}
        ${g.fb?`<div class="gm-fb ${g.fb.ok?"ok":"no"}"><b>${g.fb.ok?"ترتيب صحيح":"الترتيب غير صحيح"}</b></div>
          <div class="gm-work"><b>الترتيب الصحيح:</b><br>${g.fb.work}</div>`:""}
        <div class="gm-actions">
          ${g.fb?`<button class="gm-btn p" onclick="GM.stmtNext()">إلى الحساب ←</button>`
                :`<button class="gm-btn p" onclick="GM.stmtCheckOrder()">تحقّق من الترتيب</button>
                  <button class="gm-btn g" onclick="GM.stmtUndo()">↩ تراجع</button>`}
        </div></div>`;
  }
  const all=stmtSpecs(), lim=Math.min(g.target,5), sp=all[g.step];
  return `${hud(["🧾 خطوة "+(g.step+1)+" / "+lim])}
    <div class="gm-steps">${all.slice(0,lim).map((x,i)=>
      `<div class="gm-step ${i===g.step?"on":i<g.step?"done":""}">${i+1}. ${x.lab}</div>`).join("")}</div>
    <div class="gm-card">
      <h3 class="gm-q">${E(sp.q)}</h3>
      <input class="gm-num" inputmode="decimal" placeholder="اكتب الرقم (ريال)" value="${E(g.val)}"
        oninput="GM.stmtInput(this.value)" onkeydown="if(event.key==='Enter')GM.stmtCheck()" ${g.fb?"disabled":""}>
      ${g.warn?`<div class="gm-fb no">${E(g.warn)}</div>`:""}
      ${g.fb?fbBox(g.fb.ok, g.fb.ans, null, g.fb.work):""}
      <div class="gm-actions">${g.fb
        ?`<button class="gm-btn p" onclick="GM.stmtNext()">${g.step>=lim-1?"النتيجة ←":"الخطوة التالية ←"}</button>`
        :`<button class="gm-btn p" onclick="GM.stmtCheck()">تحقّق</button>`}</div>
    </div>`;
}

function acc(k){ return GM_ACCOUNTS[k]; }
function entryText(dr,cr){ return "من "+acc(dr)+" (مدين) — إلى "+acc(cr)+" (دائن)"; }
function entryQs(){
  return sh(GM_ENTRIES.map(e=>{
    // مموّهات: عكس القيد، وحسابان عشوائيان مختلفان
    const set=new Set([e.dr+"|"+e.cr]);
    const cand=[{dr:e.dr,cr:e.cr,ok:true}];
    if(!set.has(e.cr+"|"+e.dr)){ set.add(e.cr+"|"+e.dr); cand.push({dr:e.cr,cr:e.dr,ok:false}); }
    const keys=Object.keys(GM_ACCOUNTS);
    let guard=0;
    while(cand.length<4 && guard++<40){
      const a=pick(keys), b=pick(keys);
      if(a===b) continue;
      const key=a+"|"+b;
      if(set.has(key)) continue;
      set.add(key); cand.push({dr:a,cr:b,ok:false});
    }
    return { ev:e.ev, why:e.why, ans:entryText(e.dr,e.cr), opts:sh(cand).map(c=>entryText(c.dr,c.cr)) };
  }));
}
function entryStart(one){
  const all=entryQs();
  S.g={ qs: one?[all[0]] : all.slice(0, S.mode==="teams"?S.teamQ:9), i:0, score:0,right:0,wrong:0, fb:null, picked:null };
}
function entryAnswer(v){
  const g=S.g; if(g.fb) return;
  const q=g.qs[g.i], ok=v===q.ans; g.picked=v; mark(ok);
  if(ok) addScore(15); else logErr(q.ev, q.ans, v, q.why);
  g.fb={ok,ans:q.ans,why:q.why}; draw();
}
function entryNext(){
  const g=S.g; g.fb=null; g.picked=null;
  if(advance()) return;
  g.i++; if(g.i>=g.qs.length) return finish();
  draw();
}
function entryView(){
  const g=S.g,q=g.qs[g.i];
  return `${hud(["⚖️ "+(g.i+1)+(S.mixed?"":" / "+g.qs.length)])}
    <div class="gm-card"><h3 class="gm-q">ما القيد المحاسبي الصحيح لهذا الحدث؟</h3>
      <div class="gm-item gm-item-sm">${E(q.ev)}</div>
      ${opts(q.opts,g.fb,q.ans,g.picked,"GM.entryAnswer")}

/* ============================================================
   و٣ – ٤) تحميل التكاليف الصناعية والفرق
   ============================================================ */
function makeOH(){
  const dl=1000*pick([40,50,60,80,100,120,150,200]);
  const rate=pick([40,50,60,75,80,120,150]);           // % من الأجور المباشرة
  const applied=Math.round(dl*rate/100);
  const gap=1000*pick([2,3,4,5,6,8,10]);
  const over=Math.random()<.5;                          // محمّل أكثر من الفعلي؟
  const actual=over? applied-gap : applied+gap;
  return { dl, rate, applied, actual, gap, over,
           dir: over?"بالزيادة (تحميل أكثر من الفعلي)":"بالنقص (تحميل أقل من الفعلي)" };
}
function ohStart(){
  S.g={ p:makeOH(), step:0, val:"", fb:null, score:0,right:0,wrong:0, solved:0,
        target:S.mode==="teams"?1:3, treat: pick(GM_OH_TREAT) };
}
function ohInput(v){ S.g.val=v; }
function ohDir(v){
  const g=S.g,p=g.p; if(g.fb) return;
  const ok = (v==="over")===p.over; mark(ok); if(ok) addScore(15);
  else logErr("اتجاه فرق التحميل", p.dir, v==="over"?"بالزيادة":"بالنقص",
              "محمّل أكثر من الفعلي = بالزيادة، ومحمّل أقل = بالنقص.");
  g.fb={ok, kind:"dir", ans:p.dir,
    work:`المحمَّلة ${N(p.applied)} ${p.over?"<b>أكبر من</b>":"<b>أقل من</b>"} الفعلية ${N(p.actual)} ⇐ الفرق ${p.dir}.`};
  draw();
}
function ohTreat(v){
  const g=S.g, t=g.treat; if(g.fb) return;
  const ok=v===t.o[t.c]; mark(ok); if(ok) addScore(15);
  else logErr(t.q, t.o[t.c], v, t.why);
  g.fb={ok, kind:"treat", ans:t.o[t.c], work:t.why};
  draw();
}
function ohCheck(){
  const g=S.g,p=g.p;
  const v=parseFloat(String(g.val).replace(/[,\s]/g,""));
  if(isNaN(v)){ g.warn="اكتب رقماً."; return draw(); }
  g.warn=null;
  const sp = g.step===0
    ? {t:p.applied, pts:15, lab:"ت.ص.غ.م المحمَّلة", w:`ت.ص.غ.م المحمَّلة = الأجور المباشرة × المعدل = ${N(p.dl)} × ${p.rate}% = <b>${N(p.applied)}</b> ريال`}
    : {t:p.gap, pts:15, lab:"فرق التحميل", w:`فرق التحميل = |${N(p.applied)} − ${N(p.actual)}| = <b>${N(p.gap)}</b> ريال`};
  const ok=Math.abs(v-sp.t)<0.5; mark(ok); if(ok) addScore(sp.pts);
  if(!ok) logErr(sp.lab, N(sp.t)+" ريال", N(v), sp.w.replace(/<[^>]+>/g,""));
  g.fb={ok, kind:"num", ans:N(sp.t)+" ريال", work:sp.w};
  draw();
}
function ohNext(){
  const g=S.g; g.fb=null; g.val=""; g.warn=null; g.step++;
  if(g.step>3){
    g.solved++; g.step=0;
    if(S.mode==="teams"){ nextTurn(); if(S.qDone>=S.teamQ) return finish(); }
    else if(g.solved>=g.target) return finish();
    g.p=makeOH(); g.treat=pick(GM_OH_TREAT);
  }
  draw();
}
function ohView(){
  const g=S.g,p=g.p,st=g.step;
  const names=["احسب المحمَّلة","احسب الفرق","اتجاه الفرق","معالجة الفرق"];
  const steps=`<div class="gm-steps">${names.map((n,i)=>`<div class="gm-step ${i===st?"on":i<st?"done":""}">${i+1}. ${n}</div>`).join("")}</div>`;
  let body="";
  if(st===0){
    body=`<div class="gm-eq">ت.ص.غ.م المحمَّلة = الأجور المباشرة × المعدل التقديري</div>
      <p class="gm-q">الأجور المباشرة ${N(p.dl)} ريال، ومعدل التحميل ${p.rate}% من الأجور المباشرة. كم ت.ص.غ.م المحمَّلة؟</p>
      <input class="gm-num" inputmode="decimal" placeholder="اكتب الرقم (ريال)" value="${E(g.val)}"
        oninput="GM.ohInput(this.value)" onkeydown="if(event.key==='Enter')GM.ohCheck()" ${g.fb?"disabled":""}>`;
  } else if(st===1){
    body=`<div class="gm-eq">المحمَّلة ${N(p.applied)} ريال &nbsp;·&nbsp; الفعلية ${N(p.actual)} ريال</div>
      <p class="gm-q">كم فرق تحميل ت.ص.غ.م (بالقيمة المطلقة)؟</p>
      <input class="gm-num" inputmode="decimal" placeholder="اكتب الرقم (ريال)" value="${E(g.val)}"
        oninput="GM.ohInput(this.value)" onkeydown="if(event.key==='Enter')GM.ohCheck()" ${g.fb?"disabled":""}>`;
  } else if(st===2){
    const b=(v,l)=>{ let c="gm-opt"; if(g.fb){ const isOver=(v==="over"); if(isOver===p.over) c+=" right"; }
      return `<button class="${c}" ${g.fb?"disabled":""} onclick="GM.ohDir('${v}')"><span>${l}</span></button>`; };
    body=`<div class="gm-eq">المحمَّلة ${N(p.applied)} ريال &nbsp;·&nbsp; الفعلية ${N(p.actual)} ريال</div>
      <p class="gm-q">في أي اتجاه يكون فرق التحميل؟</p>
      <div class="gm-opts">${b("over","بالزيادة — المحمَّلة أكبر من الفعلية")}${b("under","بالنقص — المحمَّلة أقل من الفعلية")}</div>`;
  } else {
    body=`<p class="gm-q">${E(g.treat.q)}</p>${opts(g.treat.o,g.fb,g.treat.o[g.treat.c],null,"GM.ohTreat")}`;
  }
  return `${hud([S.mode==="teams"?"🏭 مسألة":"🏭 مسألة "+(g.solved+1)+" / "+g.target])}
    ${steps}
    <div class="gm-card">${body}
      ${g.warn?`<div class="gm-fb no">${E(g.warn)}</div>`:""}
      ${g.fb?`<div class="gm-fb ${g.fb.ok?"ok":"no"}"><b>${g.fb.ok?"إجابة صحيحة":"إجابة غير صحيحة"}${g.fb.ans?" — الإجابة النموذجية: "+E(g.fb.ans):""}</b></div>
        <div class="gm-work"><b>الحل:</b><br>${g.fb.work}</div>`:""}
      <div class="gm-actions">${g.fb
        ?`<button class="gm-btn p" onclick="GM.ohNext()">${st>=3?"مسألة جديدة ←":"الخطوة التالية ←"}</button>`
        :(st===0||st===1?`<button class="gm-btn p" onclick="GM.ohCheck()">تحقّق</button>`:"")}</div>
    </div>`;
}

  root.className="gm"+(S.big?" big":"");
  const meta=gameMeta(S.game);
  const title = S.screen==="home" ? "ألعاب محاسبة التكاليف"
    : (S.mixed?"🔀 تحدٍّ شامل — ":"")+((meta&&meta.em||"")+" "+(meta&&meta.name||""));
  root.innerHTML=`<div class="gm-wrap">
    <div class="gm-top">
      <div class="gm-brand"><span class="ic">🎮</span><span>${E(title)}</span></div>
      <div class="sp">
        ${S.screen!=="home"?`<button class="gm-btn g sm" onclick="GM.home()">◀ القائمة</button>`:""}
        <button class="gm-btn ${S.big?"p":"g"} sm" onclick="GM.toggleBig()">🔎 خط كبير</button>
        <button class="gm-btn g sm" onclick="GM.close()">✕ خروج</button>
      </div></div>
    ${S.screen==="home"?homeView():S.screen==="end"?endView():(VIEWS[S.game]||homeView)()}
  </div>`;
  if(focus){ const el=root.querySelector(".gm-num"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }
}

/* ---------- واجهة عامة ---------- */
function open(o){
  if(root) return;
  S=fresh();
  if(o&&o.unit&&UNITS_DEF[o.unit]&&unitIds().indexOf(o.unit)>=0) S.unit=o.unit;
  if(unitIds().length===1) S.unit=unitIds()[0];
  root=document.createElement("div"); root.id="gmOverlay"; root.className="gm";
  document.body.appendChild(root);
  document.documentElement.style.overflow="hidden";
  document.addEventListener("keydown",keys);
  draw();
}
function close(){
  stopTimer(); document.removeEventListener("keydown",keys);
  if(root&&root.parentNode) root.parentNode.removeChild(root);
  root=null; S=null; document.documentElement.style.overflow="";
}
function keys(e){
  if(!S) return;
  if(e.key==="Escape"){ e.preventDefault(); if(S.screen==="play") quit(); else close(); return; }
  if(S.screen==="play"&&S.g&&!S.g.fb){
    if(S.game==="sort"){ if(e.key==="1")sortAnswer("f"); if(e.key==="2")sortAnswer("v"); if(e.key==="3")sortAnswer("m"); }
    if(S.game==="func"){ if(e.key==="1")funcAnswer("p"); if(e.key==="2")funcAnswer("s"); if(e.key==="3")funcAnswer("a"); }
    if(S.game==="jvp"){ if(e.key==="1")jvpAnswer("j"); if(e.key==="2")jvpAnswer("p"); }
    if(S.game==="doc"){ if(e.key==="1")docAnswer("cost"); if(e.key==="2")docAnswer("req"); if(e.key==="3")docAnswer("tkt"); }
  }
}
function home(){ stopTimer(); S.screen="home"; S.game=null; S.mixed=false; S.g=null; S.mix=null;
  S.log=[]; S.qDone=0; S.turn=0; S.teams.forEach(t=>t.score=0);
  if(unitIds().length===1) S.unit=unitIds()[0];
  draw(); }
function setUnit(u){ S.unit=u; draw(); }
function play(k){
  stopTimer(); S.screen="play"; S.log=[]; S.qDone=0; S.turn=0; S.teams.forEach(t=>t.score=0);
  if(k==="mixed"){ mixedStart(); } else { S.mixed=false; S.game=k; STARTERS[k](false); }
  draw();
}
function finish(){ stopTimer(); S.screen="end"; draw(); }
function quit(){ finish(); }
function setMode(m){ S.mode=m; draw(); }
function setQ(n){ S.teamQ=n; draw(); }
function toggleBig(){ S.big=!S.big; draw(); }
function teamName(i,v){ S.teams[i].name=v; }
function addTeam(){ if(S.teams.length<4){ S.teams.push({name:"الفريق "+["الأول","الثاني","الثالث","الرابع"][S.teams.length],score:0}); draw(); } }
function delTeam(){ if(S.teams.length>2){ S.teams.pop(); draw(); } }

return { open, close, home, play, quit, setUnit, setMode, setQ, toggleBig, teamName, addTeam, delTeam,
  sortAnswer, sortNext, chartsAnswer, chartsNext, hlPickRow, hlInput, hlCheck, hlNext,
  facInput, facChoice, facCheck, facNext,
  matrixAnswer, matrixNext, funcAnswer, funcNext, cmpAnswer, cmpNext,
  stmtPick, stmtUndo, stmtCheckOrder, stmtInput, stmtCheck, stmtNext,
  jvpAnswer, jvpNext, docAnswer, docNext, entryAnswer, entryNext,
  ohInput, ohCheck, ohDir, ohTreat, ohNext };
