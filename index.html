{q:"اذكر أنواع التبويب حسب علاقة عنصر التكلفة بوحدة النشاط.", a:"يهدف إلى تتبع عناصر التكلفة بوحدة المنتج النهائي، ويقسمها إلى: 1. تكاليف مباشرة. 2. تكاليف غير مباشرة."},
{q:"اذكر أنواع التبويب حسب علاقة عنصر التكلفة بالطاقة المستغلة وغير المستغلة.", a:"يتم تقسيم التكاليف الثابتة إلى: 1. تكاليف ثابتة تتعلق بالطاقة المستغلة. 2. تكاليف ثابتة تتعلق بالطاقة غير المستغلة (العاطلة)."},
{q:"ما الفرق بين التكاليف الصناعية والتكاليف غير الصناعية (فترة)؟", a:"التكاليف الصناعية هي التكاليف التي تنشأ داخل المصنع وترتبط بعملية الإنتاج (مواد، أجور، خدمات صناعية)، وتدخل في تكوين تكلفة المخزون. أما التكاليف غير الصناعية فهي تتعلق بفترة زمنية محددة (مصاريف بيعية وإدارية) ولا تدخل في تكلفة المخزون، بل تظهر كمصروفات في قائمة الدخل عند حدوثها. ---"},
],
"u2": [
{q:"ما المقصود بتحليل سلوك التكاليف؟ وما الهدف منه؟", a:"تحليل سلوك التكاليف هو دراسة كيفية استجابة التكلفة للتغير في مستوى النشاط. الهدف منه هو فصل الجزء الثابت عن الجزء المتغير في التكاليف المختلطة لمساعد الإدارة في التخطيط والرقابة واتخاذ القرارات."},
{q:"اشرح بإيجاز طريقة أعلى وأدنى مستوى في تحليل سلوك التكاليف.", a:"تعتمد على تحديد أعلى وأدنى مستوى للنشاط، ثم حساب التكلفة المتغيرة للوحدة بقسمة الفرق في التكلفة بين المستويين على الفرق في حجم النشاط بينهما. ثم يتم حساب الجزء الثابت بطرح (المتغير للوحدة × حجم النشاط) من إجمالي التكلفة عند أي من المستويين."},
{q:"اشرح بإيجاز طريقة شكل الانتشار (البيانية) في تحليل سلوك التكاليف.", a:"تعتمد على رسم العلاقة بين التكلفة (المحور الرأسي) وحجم النشاط (المحور الأفقي) على رسم بياني. يتم رسم نقاط البيانات، ثم رسم خط بياني يمر بأغلب النقاط ليمثل اتجاه التكلفة. بناءً على هذا الخط، يمكن تحديد الجزء الثابت (نقطة تقاطع الخط مع محور التكاليف) والمتغير (ميل الخط)."},
{q:"ما هي معادلة التكاليف الخطية العامة؟ وضح دلالة كل رمز فيها.", a:"المعادلة هي: ص = أ + ب س، حيث: - ص: إجمالي التكاليف. - أ: إجمالي التكاليف الثابتة (الجزء الثابت). - ب: التكلفة المتغيرة للوحدة (معدل التغير). - س: حجم النشاط (عدد الوحدات أو ساعات العمل)."},
{q:"إذا كانت معادلة التكاليف هي ص = 80,000 + 6 س (حيث س = عدد الوحدات). احسب إجمالي التكاليف عند إنتاج 10,000 وحدة، وحدد التكاليف الثابتة والمتغيرة.", a:"إجمالي التكاليف = 80,000 + (6 × 10,000) = 80,000 + 60,000 = 140,000 ريال. التكاليف الثابتة = 80,000 ريال. التكاليف المتغيرة = 60,000 ريال (أو 6 ريال للوحدة)."},
{q:"كيف يتم حساب التكلفة المتغيرة للوحدة باستخدام طريقة أعلى وأدنى مستوى؟", a:"التكلفة المتغيرة للوحدة = (التكلفة عند أعلى مستوى نشاط - التكلفة عند أدنى مستوى نشاط) ÷ (أعلى مستوى نشاط - أدنى مستوى نشاط)."},
{q:"كيف يتم حساب التكاليف الثابتة بعد حساب التكلفة المتغيرة للوحدة في طريقة أعلى وأدنى مستوى؟", a:"التكاليف الثابتة = إجمالي التكاليف عند المستوى الأعلى (أو الأدنى) - (التكلفة المتغيرة للوحدة × حجم النشاط عند نفس المستوى)."},
{q:"ما هي التكاليف الغارقة (التاريخية)؟ أعط مثالاً.", a:"هي تكاليف تم تكبدها بالفعل في الماضي، ولا يمكن تغييرها أو استردادها بالقرار الحالي، وبالتالي فهي غير ذات صلة باتخاذ القرارات المستقبلية. مثال: ثمن آلة تم شراؤها منذ سنوات، ولا يؤثر هذا الثمن على قرار استبدالها أو الاستمرار بها الآن."},
{q:"ما هي تكلفة الفرصة البديلة؟ أعط مثالاً.", a:"هي الدخل أو المنفعة التي يتم التخلي عنها عند اختيار بديل عن آخر. مثال: إذا استخدمت المنشأة مساحة المصنع لإنتاج منتج جديد بدلاً من تأجيرها، فإن إيجار المساحة الذي تم التخلي عنه يمثل تكلفة الفرصة البديلة."},
{q:"ما هي التكاليف الحدية؟", a:"هي التكلفة الإضافية التي تتكبدها المنشأة نتيجة إنتاج وحدة إضافية واحدة من المنتج."},
{q:"عرّف التكاليف الثابتة الملزمة، مع ذكر مثال.", a:"هي تكاليف ثابتة لا يمكن تغييرها على المدى القصير لأنها تتعلق بالهيكل الأساسي للمنشأة مثل الإيجارات طويلة الأجل، واستهلاك الآلات، ورواتب الإدارة العليا. مثال: استهلاك مبنى المصنع."},
{q:"عرّف التكاليف التقديرية (الاختيارية)، مع ذكر مثال.", a:"هي تكاليف ثابتة يمكن للإدارة تغييرها أو تخفيضها حسب الحاجة، وتتعلق بقرارات الإدارة التقديرية. مثال: مصاريف الدعاية والإعلان، والتدريب، والبحث والتطوير."},
{q:"ما الفرق بين التكاليف التفاضلية والتكاليف الغارقة من حيث الصلة باتخاذ القرار؟", a:"التكاليف التفاضلية هي التي تختلف بين البدائل وتكون ذات صلة بالقرار، أما التكاليف الغارقة فهي تكاليف تاريخية لا تختلف بين البدائل ولا تؤثر في القرار الحالي."},
{q:"اذكر أهم طرق تحليل سلوك التكاليف التي تعتمد على التحليل الإحصائي للبيانات التاريخية.", a:"الطرق الرئيسية هي: طريقة أعلى وأدنى مستوى، وطريقة شكل الانتشار (الرسم البياني)، وطريقة تحليل الانحدار (المربعات الصغرى) والتي تعتبر الأكثر دقة."},
{q:"لماذا تعتبر طريقة تحليل الانحدار أكثر دقة من طريقة أعلى وأدنى مستوى؟", a:"لأن طريقة الانحدار تستخدم جميع نقاط البيانات المتاحة، وليس نقطتين فقط، مما يقلل من تأثير القيم الشاذة ويعطي تقديراً إحصائياً أكثر دقة للعلاقة بين التكلفة وحجم النشاط."},
{q:"في تحليل سلوك التكاليف، ما العلاقة بين التكلفة المتغيرة للوحدة وحجم النشاط؟", a:"العلاقة طردية بين إجمالي التكاليف المتغيرة وحجم النشاط، ولكن التكلفة المتغيرة للوحدة تظل ثابتة بغض النظر عن حجم النشاط ضمن المدى الملائم."},
{q:"في تحليل سلوك التكاليف، ما العلاقة بين إجمالي التكاليف الثابتة وحجم النشاط؟", a:"إجمالي التكاليف الثابتة لا يتغير بتغير حجم النشاط ضمن المدى الملائم (علاقة ثابتة)، أي أنه يظل كما هو عند مستويات الإنتاج المختلفة."},
{q:"ما هو مفهوم \"نسبة الاستغلال\" في سياق التكاليف الثابتة؟", a:"هي نسبة النشاط الفعلي إلى الطاقة الإنتاجية المتاحة. وتستخدم لتحديد الجزء المستغل من التكاليف الثابتة والجزء العاطل (غير المستغل)، حيث: الطاقة المستغلة = التكاليف الثابتة الكلية × نسبة الاستغلال، والطاقة غير المستغلة = التكاليف الثابتة الكلية - الطاقة المستغلة."},
{q:"إذا كانت الطاقة المتاحة 15,000 وحدة، والإنتاج الفعلي 12,000 وحدة، احسب نسبة الطاقة المستغلة.", a:"نسبة الطاقة المستغلة = (النشاط الفعلي ÷ الطاقة المتاحة) × 100 = (12,000 ÷ 15,000) × 100 = 80%."},
{q:"متى تكون التكلفة شبه المتغيرة؟ اشرح بالمعادلة.", a:"تكون التكلفة شبه المتغيرة عندما تحتوي على عنصرين: عنصر ثابت لا يتغير بتغير النشاط، وعنصر متغير يتغير بتغير النشاط. وتعبر عنها بالمعادلة: ص = أ + ب س، حيث أ هو الجزء الثابت و ب هو معدل التغير للوحدة. ---"},
],
"u3": [
{q:"ما هو نظام أوامر الإنتاج؟ وفي أي نوع من المنشآت يستخدم؟", a:"هو نظام محاسبي يستخدم لتجميع وتخصيص التكاليف لكل أمر إنتاجي أو دفعة إنتاجية على حدة. يستخدم في المنشآت التي تنتج منتجات متنوعة حسب مواصفات كل عميل، مثل صناعة الأثاث والملابس حسب الطلب، والطباعة، والبناء."},
{q:"ما هي بطاقة الأمر الإنتاجي (بطاقة التكاليف)؟ وما فائدتها؟", a:"هي مستند رئيسي في نظام الأوامر يجمع عليه جميع تكاليف الأمر الإنتاجي (مواد مباشرة، أجور مباشرة، تكاليف غير مباشرة محملة). فائدتها أنها تحدد التكلفة الإجمالية للأمر وتكلفة الوحدة منه، وتساعد في الرقابة على التكاليف."},
{q:"ما هي بطاقة المواد (أمر صرف المواد)؟ وما استخدامها؟", a:"هي مستند يستخدم لطلب وصرف المواد من المخزن، ويوضح نوع وكمية المواد المطلوبة للأمر الإنتاجي المعين. تستخدم لتحديد تكلفة المواد المباشرة الخاصة بكل أمر."},
{q:"ما هي بطاقة العمل؟ وما المعلومات التي تحتوي عليها؟", a:"هي مستند يستخدم لتسجيل ساعات العمل المباشرة التي يؤديها العمال على الأوامر الإنتاجية. تحتوي على اسم العامل، رقمه، القسم، تاريخ العمل، عدد الساعات العادية والإضافية، وتستخدم لحساب الأجور المباشرة المستحقة لكل أمر."},
{q:"ما هو معدل تحميل التكاليف الصناعية غير المباشرة؟ وكيف يتم حسابه؟", a:"هو معدل تقديري يستخدم لتوزيع التكاليف الصناعية غير المباشرة على الأوامر الإنتاجية قبل معرفة التكاليف الفعلية. يحسب بقسمة إجمالي التكاليف الصناعية غير المباشرة التقديرية على إجمالي الأساس التقديري (مثل ساعات العمل المباشرة، أو تكلفة الأجور المباشرة)."},
{q:"لماذا تستخدم التكاليف الصناعية غير المباشرة التقديرية بدلاً من الفعلية في نظام الأوامر؟", a:"لأسباب عملية أهمها: 1. الرغبة في تحديد تكلفة المنتج فور إتمامه دون انتظار حصر بعض التكاليف غير المباشرة الفعلية (مثل فاتورة الكهرباء). 2. تفادي التقلبات الموسمية في التكاليف غير المباشرة (مثل تكاليف التدفئة) التي لا تعكس الكفاءة الحقيقية. 3. لتسهيل عملية التسعير واتخاذ القرارات في الوقت المناسب."},
{q:"عرّف فرق تحميل التكاليف الصناعية غير المباشرة، وكيف ينشأ؟", a:"هو الفرق بين إجمالي التكاليف الصناعية غير المباشرة المحملة (التقديرية) وإجمالي التكاليف الصناعية غير المباشرة الفعلية. ينشأ بسبب عدم تطابق التكاليف التقديرية مع الفعلية في نهاية الفترة."},
{q:"ما هي المعالجة المحاسبية الأكثر شيوعاً لفرق تحميل التكاليف الصناعية غير المباشرة في نهاية الفترة؟", a:"المعالجة الأكثر شيوعاً عملياً هي تحميل الفرق بالكامل في حساب تكلفة البضاعة المباعة، وذلك لسهولتها وقلة الإجراءات التي تتطلبها."},
{q:"متى يتم توزيع فرق تحميل التكاليف الصناعية غير المباشرة على الحسابات الثلاثة (تحت التشغيل، التام، المباع)؟", a:"يتم توزيعه نسبياً على الحسابات الثلاثة عندما يكون حجم الانحراف (الفرق) كبيراً نسبياً بحيث يؤثر بشكل رئيسي على التكاليف، للحصول على تكاليف أكثر دقة."},
{q:"اكتب القيد المحاسبي لتحميل المواد المباشرة على أوامر الإنتاج.", a:"- من حـ/ مراقبة الإنتاج تحت التشغيل - إلى حـ/ مراقبة المخازن (مواد مباشرة)"},
{q:"اكتب القيد المحاسبي لتحميل الأجور المباشرة المستحقة على أوامر الإنتاج.", a:"- من حـ/ مراقبة الإنتاج تحت التشغيل - إلى حـ/ الأجور المباشرة المستحقة"},
{q:"اكتب القيد المحاسبي لتحميل التكاليف الصناعية غير المباشرة التقديرية على أوامر الإنتاج.", a:"- من حـ/ مراقبة الإنتاج تحت التشغيل - إلى حـ/ مراقبة التكاليف الصناعية غير المباشرة المحملة (التقديرية)"},
{q:"اكتب القيد المحاسبي لإثبات التكاليف الصناعية غير المباشرة الفعلية (مواد غير مباشرة، أجور غير مباشرة).", a:"- من حـ/ مراقبة التكاليف الصناعية غير المباشرة الفعلية - إلى مذكورين: - حـ/ مراقبة المخازن (مواد غير مباشرة) - حـ/ الأجور غير المباشرة المستحقة - حـ/ استهلاك الآلات - حـ/ الدائنون (مصاريف أخرى)"},
{q:"اكتب القيد المحاسبي لإقفال حساب التكاليف الصناعية غير المباشرة (عند وجود فرق تحميل بالنقصان) في حساب تكلفة البضاعة المباعة.", a:"(إذا كانت المحملة 7,080 ريال، والفعلية 8,716 ريال، أي فرق نقصان 1,636 ريال) - من مذكورين: - حـ/ مراقبة التكاليف الصناعية غير المباشرة المحملة (تقديرية) 7,080 - حـ/ تكلفة البضاعة المباعة (فرق التحميل) 1,636 - إلى حـ/ مراقبة التكاليف الصناعية غير المباشرة الفعلية 8,716"},
{q:"اكتب القيد المحاسبي لإقفال حساب التكاليف الصناعية غير المباشرة (عند وجود فرق تحميل بالزيادة) في حساب تكلفة البضاعة المباعة.", a:"(إذا كانت المحملة 20,000 ريال، والفعلية 15,000 ريال، أي فرق زيادة 5,000 ريال) - من حـ/ مراقبة التكاليف الصناعية غير المباشرة المحملة (تقديرية) 20,000 - إلى مذكورين: - حـ/ تكلفة البضاعة المباعة (فرق التحميل) 5,000 - حـ/ مراقبة التكاليف الصناعية غير المباشرة الفعلية 15,000"},
{q:"اكتب القيد المحاسبي لإثبات تكلفة الأوامر الإنتاجية التامة في نهاية الفترة.", a:"- من حـ/ مراقبة الإنتاج التام - إلى حـ/ مراقبة الإنتاج تحت التشغيل"},
{q:"اكتب القيد المحاسبي لإثبات تكلفة الأوامر الإنتاجية التي تم بيعها وتسليمها للعملاء.", a:"- من حـ/ تكلفة البضاعة المباعة - إلى حـ/ مراقبة الإنتاج التام"},
{q:"ما هو الحساب الذي يمثل تكلفة الأوامر الجاري إنتاجها في نهاية الفترة؟", a:"حساب مراقبة الإنتاج تحت التشغيل، حيث يمثل رصيده المدينة تكلفة الأوامر التي لم تنتهِ بعد في نهاية الفترة المحاسبية."},
{q:"ما هو الحساب الذي يمثل تكلفة الأوامر التامة غير المباعة في نهاية الفترة؟", a:"حساب مراقبة الإنتاج التام، حيث يمثل رصيده المدينة تكلفة الأوامر التي تم إنتاجها بالكامل ولم تبع بعد."},
{q:"إذا كانت تكلفة أمر إنتاجي تتكون من مواد مباشرة 4,000 ريال، وأجور مباشرة 6,000 ريال، ومعدل تحميل التكاليف غير المباشرة 50% من الأجور، احسب التكلفة الإجمالية للأمر.", a:"التكاليف غير المباشرة المحملة = 50% × 6,000 = 3,000 ريال. التكلفة الإجمالية = 4,000 + 6,000 + 3,000 = 13,000 ريال. ---"},
],
"u4": [
{q:"عرّف نقطة التعادل، وما أهميتها للإدارة؟", a:"نقطة التعادل هي حجم النشاط (مبيعات أو إنتاج) الذي يتساوى عنده إجمالي الإيرادات مع إجمالي التكاليف، ويكون الربح صفراً. أهميتها أنها تساعد الإدارة في تحديد الحد الأدنى من المبيعات اللازم لتغطية التكاليف، وتقييم المخاطر، واتخاذ القرارات التسعيرية."},
{q:"اكتب معادلة حساب حجم التعادل بالوحدات.", a:"حجم التعادل بالوحدات = التكاليف الثابتة الكلية ÷ هامش المساهمة للوحدة. حيث هامش المساهمة للوحدة = سعر البيع للوحدة - التكلفة المتغيرة للوحدة."},
{q:"اكتب معادلة حساب قيمة التعادل بالريال.", a:"قيمة التعادل بالريال = التكاليف الثابتة الكلية ÷ نسبة هامش المساهمة. حيث نسبة هامش المساهمة = هامش المساهمة للوحدة ÷ سعر البيع للوحدة."},
{q:"عرّف هامش المساهمة، وما أهميته في تحليل التعادل؟", a:"هامش المساهمة هو الفرق بين سعر البيع والتكلفة المتغيرة للوحدة، وهو المبلغ الذي تساهم به كل وحدة مباعة في تغطية التكاليف الثابتة وتحقيق الربح. أهميته أنه الأساس في حساب نقطة التعادل وتحليل الربحية."},
{q:"إذا كانت التكاليف الثابتة 100,000 ريال، وسعر البيع 30 ريال، والتكلفة المتغيرة للوحدة 14 ريال. احسب هامش المساهمة للوحدة، ونقطة التعادل بالوحدات، وقيمة التعادل.", a:"- هامش المساهمة للوحدة = 30 - 14 = 16 ريال. - حجم التعادل بالوحدات = 100,000 ÷ 16 = 6,250 وحدة. - قيمة التعادل بالريال = 6,250 × 30 = 187,500 ريال (أو 100,000 ÷ (16/30) = 187,500)."},
{q:"عرّف هامش الأمان، وكيف يحسب بالوحدات والنسبة؟", a:"هامش الأمان هو الفرق بين المبيعات الفعلية أو المتوقعة ومبيعات التعادل. يحسب: - بالوحدات: المبيعات الفعلية بالوحدات - مبيعات التعادل بالوحدات. - بالنسبة: (المبيعات الفعلية - مبيعات التعادل) ÷ المبيعات الفعلية × 100."},
{q:"إذا كانت المبيعات الفعلية 20,000 وحدة، ومبيعات التعادل 15,000 وحدة، احسب هامش الأمان بالوحدات والنسبة.", a:"- هامش الأمان بالوحدات = 20,000 - 15,000 = 5,000 وحدة. - نسبة هامش الأمان = (5,000 ÷ 20,000) × 100 = 25%."},
{q:"ما هو أثر زيادة التكاليف الثابتة مع ثبات باقي العوامل على نقطة التعادل؟", a:"زيادة التكاليف الثابتة تؤدي إلى زيادة نقطة التعادل (أي تحتاج المنشأة إلى بيع عدد أكبر من الوحدات لتغطية التكاليف)، مع بقاء هامش المساهمة للوحدة كما هو."},
{q:"ما هو أثر زيادة التكاليف المتغيرة للوحدة مع ثبات باقي العوامل على نقطة التعادل وهامش المساهمة؟", a:"زيادة التكلفة المتغيرة للوحدة تؤدي إلى انخفاض هامش المساهمة للوحدة، وبالتالي زيادة نقطة التعادل (علاقة عكسية بين التكلفة المتغيرة وهامش المساهمة، وطردية بين التكلفة المتغيرة وحجم التعادل)."},
{q:"كيف يتم حساب نقطة التعادل في حالة تعدد المنتجات (التشكيلة البيعية)؟", a:"يتم ذلك عن طريق: 1. حساب متوسط سعر البيع للتشكيلة = (سعر بيع أ × نسبة أ) + (سعر بيع ب × نسبة ب) + ... 2. حساب متوسط التكلفة المتغيرة للوحدة للتشكيلة = (ت.م. أ × نسبة أ) + (ت.م. ب × نسبة ب) + ... 3. حساب متوسط هامش المساهمة = متوسط سعر البيع - متوسط التكلفة المتغيرة. 4. حجم التعادل للتشكيلة = التكاليف الثابتة الكلية ÷ متوسط هامش المساهمة. 5. توزيع حجم التعادل على المنتجات حسب نسب التشكيلة."},
{q:"ما الفرق بين الطريقة الإجمالية الصناعية والطريقة المتغيرة الصناعية في حساب تكلفة المنتج؟", a:"في الطريقة الإجمالية، يتم تحميل المنتج بجميع التكاليف الصناعية (متغيرة وثابتة). أما في الطريقة المتغيرة، يتم تحميل المنتج بالتكاليف المتغيرة فقط، وتعتبر التكاليف الصناعية الثابتة من مصروفات الفترة."},
{q:"ما هي الطريقة المباشرة في قياس التكاليف؟", a:"هي طريقة يتم فيها تحميل المنتج بالتكاليف المباشرة فقط (مواد وأجور مباشرة)، بينما تعتبر جميع التكاليف غير المباشرة (صناعية وبيعية وإدارية) من مصروفات الفترة."},
{q:"ما هي طريقة قياس التكاليف على أساس الطاقة المستغلة؟", a:"هي طريقة يتم فيها تحميل المنتج بالتكاليف المتغيرة بالإضافة إلى الجزء المستغل فقط من التكاليف الثابتة (على أساس نسبة الاستغلال)، ويعالج الجزء غير المستغل من التكاليف الثابتة كمصروف فترة (طاقة عاطلة)."},
{q:"متى يكون الربح في الطريقة الإجمالية الصناعية أكبر من الربح في الطريقة المتغيرة الصناعية؟", a:"عندما يكون الإنتاج الفعلي أكبر من المبيعات (أي وجود زيادة في المخزون)، حيث يتم تحميل جزء من التكاليف الثابتة في المخزون في الطريقة الإجمالية، مما يقلل من مصروفات الفترة ويزيد الربح مقارنة بالطريقة المتغيرة التي تحمل كل التكاليف الثابتة كمصروفات فترة."},
{q:"ما هي المصروفات البيعية والإدارية في المنشأة الصناعية، وكيف تظهر في قائمة الدخل؟", a:"هي مصروفات غير صناعية تتعلق بوظائف البيع والإدارة (مثل رواتب مندوبي المبيعات، الدعاية، رواتب الإدارة). تظهر في قائمة الدخل بعد حساب مجمل الربح، ويتم خصمها للحصول على صافي الربح."},
{q:"اذكر خطوات إعداد قائمة التكاليف في المنشأة الصناعية بإيجاز.", a:"1. حساب تكلفة المواد المستخدمة (مخزون أول المدة + مشتريات - مخزون آخر المدة). 2. إضافة الأجور المباشرة. 3. إضافة التكاليف الصناعية غير المباشرة. 4. الحصول على إجمالي تكاليف الإنتاج. 5. إضافة مخزون الإنتاج تحت التشغيل أول المدة، وطرح مخزون الإنتاج تحت التشغيل آخر المدة للحصول على تكلفة الإنتاج التام."},
{q:"كيف يتم حساب تكلفة البضاعة المباعة في المنشأة الصناعية؟", a:"تكلفة البضاعة المباعة = تكلفة الإنتاج التام أول المدة + تكلفة الإنتاج التام خلال الفترة (من قائمة التكاليف) - تكلفة الإنتاج التام آخر المدة."},
{q:"ما هو مجمل الربح في المنشأة الصناعية، وكيف يحسب؟", a:"مجمل الربح (الربح الإجمالي) هو الفرق بين إيرادات المبيعات وتكلفة البضاعة المباعة. يعبر عن الربح المحقق من النشاط الصناعي قبل خصم المصروفات البيعية والإدارية."},
{q:"في قائمة الدخل للمنشأة الصناعية، كيف يتم الوصول إلى صافي الربح؟", a:"صافي الربح = مجمل الربح - إجمالي المصروفات البيعية والإدارية (التي تشمل المصروفات البيعية والإدارية الثابتة والمتغيرة)."},
{q:"ما هي أفضل طريقة لقياس التكاليف في المنشآت التي تعاني من طاقة عاطلة كبيرة، ولماذا؟", a:"الطريقة المستغلة تعتبر أفضل، لأنها تفصل تكلفة الطاقة غير المستغلة وتظهرها كمصروف فترة، مما يعطي صورة أوضح عن كفاءة استخدام الطاقة الإنتاجية ويسمح للإدارة بمعرفة الخسائر الناتجة عن عدم استغلال الطاقة. ---"},
],
"u5": [
{q:"عرّف التكاليف المعيارية، وما الهدف من استخدامها؟", a:"هي تكاليف محددة مسبقاً على أساس علمي، تمثل ما يجب أن تكون عليه التكاليف في ظل ظروف كفاءة معينة. الهدف منها هو التخطيط، الرقابة، تقييم الأداء، وتحليل الانحرافات."},
{q:"ما هو تحليل الانحرافات؟ وما أهميته؟", a:"هو عملية تحديد الفروق بين الأداء الفعلي والأداء المعياري (المخطط)، وتحليل أسباب هذه الفروق. أهميته في مساعدة الإدارة على تحديد مواطن القوة والضعف، واتخاذ إجراءات تصحيحية للرقابة على التكاليف وتحسين الأداء."},
{q:"عرّف الموازنة الساكنة (الثابتة).", a:"هي موازنة تعد على أساس مستوى نشاط واحد (مخطط) قبل بداية الفترة، ولا تتغير مع تغير حجم النشاط الفعلي، وتستخدم للمقارنة مع النتائج الفعلية لتحديد الانحراف الإجمالي."},
{q:"عرّف الموازنة المرنة.", a:"هي موازنة تعد لمستويات نشاط متعددة، أو تعيد حساب التكاليف والإيرادات بناءً على مستوى النشاط الفعلي المحقق في نهاية الفترة، وتستخدم لفصل تأثير التغير في حجم النشاط عن تأثير الكفاءة."},
{q:"وضح كيف يتم تحليل انحراف الموازنة الساكنة الإجمالي.", a:"يتم تحليله إلى: 1. انحراف الموازنة المرنة: وهو الفرق بين النتائج الفعلية والموازنة المرنة (على أساس النشاط الفعلي)، ويعكس كفاءة الإدارة في التحكم بالتكاليف والإيرادات. 2. انحراف حجم المبيعات: وهو الفرق بين الموازنة المرنة والموازنة الساكنة (على أساس النشاط المخطط)، ويعكس أثر تغير حجم المبيعات الفعلي عن المخطط."},
{q:"اكتب صيغة حساب انحراف سعر المواد.", a:"انحراف سعر المواد = (السعر الفعلي للمادة - السعر المعياري للمادة) × الكمية الفعلية للمادة المستخدمة."},
{q:"اكتب صيغة حساب انحراف كفاءة (كمية) المواد.", a:"انحراف كفاءة المواد = (الكمية الفعلية للمادة المستخدمة - الكمية المعيارية المسموح بها للإنتاج الفعلي) × السعر المعياري للمادة."},
{q:"اكتب صيغة حساب انحراف معدل الأجر.", a:"انحراف معدل الأجر = (معدل الأجر الفعلي للساعة - معدل الأجر المعياري للساعة) × عدد ساعات العمل الفعلية."},
{q:"اكتب صيغة حساب انحراف كفاءة (ساعات) العمل.", a:"انحراف كفاءة العمل = (عدد ساعات العمل الفعلية - عدد ساعات العمل المعيارية المسموح بها للإنتاج الفعلي) × معدل الأجر المعياري للساعة."},
{q:"إذا كانت الكمية الفعلية للمادة 12,500 كجم بسعر 8 ريال، والكمية المعيارية 10,000 كجم بسعر 7.5 ريال. احسب انحراف السعر وانحراف الكفاءة للمواد، وحدد ما إذا كانت في صالح أم غير صالح المنشأة.", a:"- انحراف السعر = (8 - 7.5) × 12,500 = 0.5 × 12,500 = 6,250 ريال (غير صالح) لأن السعر الفعلي أعلى من المعياري. - انحراف الكفاءة = (12,500 - 10,000) × 7.5 = 2,500 × 7.5 = 18,750 ريال (غير صالح) لأن الكمية الفعلية أكبر من المعيارية. - إجمالي انحراف الموازنة المرنة للمواد = 6,250 + 18,750 = 25,000 ريال (غير صالح)."},
{q:"إذا كانت ساعات العمل الفعلية 12,000 ساعة بمعدل 5 ريال، والساعات المعيارية 10,000 ساعة بمعدل 4.75 ريال. احسب انحراف معدل الأجر وانحراف كفاءة العمل.", a:"- انحراف معدل الأجر = (5 - 4.75) × 12,000 = 0.25 × 12,000 = 3,000 ريال (غير صالح). - انحراف كفاءة العمل = (12,000 - 10,000) × 4.75 = 2,000 × 4.75 = 9,500 ريال (غير صالح)."},
{q:"متى يكون الانحراف في صالح المنشأة؟", a:"يكون الانحراف في صالح المنشأة عندما تكون التكاليف الفعلية أقل من التكاليف المعيارية، أو عندما تكون الإيرادات الفعلية أكبر من الإيرادات المخططة. مثال: انخفاض سعر المادة الفعلي عن المعياري، أو انخفاض كمية المواد المستخدمة عن المعيارية."},
{q:"ما هو انحراف الموازنة المرنة للمواد، وكيف يحسب؟", a:"هو الفرق بين تكلفة المواد الفعلية وتكلفة المواد المعيارية المسموح بها للإنتاج الفعلي. يحسب = (الكمية الفعلية × السعر الفعلي) - (الكمية المعيارية × السعر المعياري)، ويساوي مجموع انحراف السعر وانحراف الكفاءة للمواد."},
{q:"ما هو انحراف الموازنة المرنة للأجور، وكيف يحسب؟", a:"هو الفرق بين تكلفة الأجور الفعلية وتكلفة الأجور المعيارية المسموح بها للإنتاج الفعلي. يحسب = (الساعات الفعلية × معدل الأجر الفعلي) - (الساعات المعيارية × معدل الأجر المعياري)، ويساوي مجموع انحراف معدل الأجر وانحراف كفاءة العمل."},
{q:"لماذا يتم تحليل الانحرافات إلى انحرافات سعر وانحرافات كفاءة؟ وما الفائدة من ذلك؟", a:"يتم التحليل لتحديد المسؤولية بدقة. انحراف السعر يرتبط عادة بقسم المشتريات (سعر المواد) أو قسم الموارد البشرية (معدل الأجر)، بينما انحراف الكفاءة يرتبط بقسم الإنتاج (كمية المواد أو ساعات العمل). هذه الدقة تساعد في محاسبة المسؤولية واتخاذ إجراءات تصحيحية محددة."},
{q:"ما هو الفرق بين إجمالي انحراف المواد في الموازنة المرنة وإجمالي انحراف الموازنة الساكنة؟", a:"إجمالي انحراف الموازنة المرنة للمواد يقارن التكلفة الفعلية بالتكلفة المعيارية على أساس الإنتاج الفعلي، ويعكس كفاءة الإدارة. أما انحراف الموازنة الساكنة فيقارن التكلفة المعيارية على أساس الإنتاج الفعلي بالتكلفة المعيارية على أساس الإنتاج المخطط، ويعكس أثر اختلاف حجم الإنتاج."},
{q:"كيف يتم التعامل مع الانحرافات في نهاية الفترة المحاسبية في نظام التكاليف المعيارية؟", a:"يتم إقفال حسابات الانحرافات في حساب تكلفة البضاعة المباعة، أو توزيعها على حسابات المخزون (الإنتاج تحت التشغيل، التام، وتكلفة البضاعة المباعة) حسب حجمها. في العادة، تعالج الانحرافات الصغيرة في تكلفة البضاعة المباعة، بينما توزع الانحرافات الكبيرة."},
{q:"ما هي الموازنة التخطيطية، وما دور محاسبة التكاليف فيها؟", a:"الموازنة التخطيطية هي خطة مالية تفصيلية للفترة القادمة تعبر عن أهداف المنشأة. دور محاسبة التكاليف هو تزويد الإدارة بالبيانات التفصيلية عن سلوك التكاليف والعلاقة بين التكلفة والنشاط، مما يساعد في إعداد موازنات مرنة وتخطيط التكاليف بدقة."},
{q:"اشرح العلاقة بين نظام التكاليف المعيارية وتحليل الانحرافات ونظام الرقابة الداخلية.", a:"نظام التكاليف المعيارية يضع معايير للأداء، وتحليل الانحرافات يقارن الأداء الفعلي بتلك المعايير، مما يكشف عن نقاط الضعف أو القوة. هذا يشكل أداة رقابية فعالة تمكن الإدارة من تحديد المسؤوليات، واتخاذ إجراءات تصحيحية، وتحسين الأداء المستقبلي، وبالتالي تعزيز نظام الرقابة الداخلية."},
{q:"إذا كانت الشركة تنتج 10,000 وحدة فعلياً، فما هي الكمية المعيارية للمواد اللازمة إذا كانت كل وحدة تحتاج إلى 2 كجم، وانتهى الأمر باستخدام 22,000 كجم فعلياً، والسعر المعياري 5 ريال، احسب انحراف كفاءة المواد.", a:"- الكمية المعيارية = 10,000 وحدة × 2 كجم/وحدة = 20,000 كجم. - انحراف كفاءة المواد = (الكمية الفعلية - الكمية المعيارية) × السعر المعياري = (22,000 - 20,000) × 5 = 2,000 × 5 = 10,000 ريال (غير صالح)."},
],
};

/* ============================================================
   محرك المنصة — محاسبة التكاليف

/* ---------- أدوات عامة ---------- */
function esc(s){ return (s===undefined||s===null) ? "" : String(s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function $(id){ return document.getElementById(id); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function RqLabel(i){ return ["أ","ب","ج","د","هـ","و"][i] || String(i+1); }
function todayAr(){
  try { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date()); }
  catch(e){ return new Date().toLocaleDateString('ar'); }
}
const UNIT_COLOR = { navy:"var(--u-navy)", brass:"var(--u-brass)", red:"var(--u-red)", green:"var(--u-green)", ink:"var(--u-ink)" };

/* ============================================================
   1) إعدادات المنصة + الحفظ المحلي
   ============================================================ */
const LS = {
  settings:"ca_settings_v1",
  guide:"ca_guide_seen_v1",
  presPos:"ca_pres_pos_",
  presFont:"ca_pres_font_v1",
  openUnits:"ca_open_units_v1",
  logo:"ca_logo_v1"
};
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

const DEFAULT_SETTINGS = {
  title: COURSE_META.titleAr,
  institution: COURSE_META.institutionLines[1] || "",
  college: "",
  department: "",
  author: "",
  courseCode: COURSE_META.code
};
let SETTINGS = (function(){
  try { return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(lsGet(LS.settings,"{}"))); }
  catch(e){ return Object.assign({}, DEFAULT_SETTINGS); }
})();
function saveSettings(){ lsSet(LS.settings, JSON.stringify(SETTINGS)); document.title = SETTINGS.title + " — منصة تدريبية تفاعلية"; }
function orgLinesFromSettings(){
  return [SETTINGS.institution, SETTINGS.college, SETTINGS.department].filter(Boolean);
}

let SETTINGS_OPEN = false, SETTINGS_WELCOME = false;
function openSettings(welcome){ SETTINGS_WELCOME = !!welcome; SETTINGS_OPEN = true; render(); }
function closeSettings(){ SETTINGS_OPEN = false; SETTINGS_WELCOME = false; lsSet(LS.guide,"1"); render(); }
function setSetting(k,v){ SETTINGS[k]=v; }
function commitSettings(){ saveSettings(); SETTINGS_OPEN=false; SETTINGS_WELCOME=false; lsSet(LS.guide,"1"); render(); }

function renderSettingsModal(){
  const w = SETTINGS_WELCOME;
  return `
  <div class="ov" onclick="if(event.target===this)closeSettings()">
    <div class="modal">
      <div class="m-head">
        <h2>${w ? "👋 مرحباً بك" : "⚙️ إعدادات المنصة"}</h2>
        <button class="m-x" onclick="closeSettings()" title="إغلاق">✕</button>
      </div>
      <div class="m-body">
        <p class="small muted" style="margin:0 0 16px;line-height:1.9">
          ${w ? "قبل البدء باستخدام المنصة، خصّص عنوانها وبيانات جهتك التعليمية إن رغبت. يمكنك تعديل هذه البيانات لاحقاً في أي وقت."

/* ============================================================
   2) عرض أقسام الدرس
   ============================================================ */
function fmtParas(arr){ return (arr||[]).map(p=>`<p>${esc(p)}</p>`).join(""); }

function renderSectionBody(sec){
  let h = "";
  h += fmtParas(sec.paragraphs);
  if(sec.quotes) sec.quotes.forEach(q=> h += `<div class="quote">${esc(q.text)}</div>`);
  if(sec.list && sec.list.length){
    h += `<div class="deflist">${sec.list.map(it=>
      `<div class="it"><b>${esc(it.term)}</b><span>${esc(it.detail)}</span></div>`).join("")}</div>`;
  }
  if(sec.numberedList && sec.numberedList.length){
    h += `<div class="numlist">${sec.numberedList.map(it=>
      `<div class="it"><b>${esc(it.title)}</b><span>${esc(it.detail)}</span></div>`).join("")}</div>`;
  }
  if(sec.formula) h += `<div class="formula">${esc(sec.formula)}</div>`;
  if(sec.tables) sec.tables.forEach(t=>{
    h += `<div class="tbl-wrap">
      ${t.title?`<div class="tbl-cap">${esc(t.title)}</div>`:""}
      <table class="t"><thead><tr>${(t.columns||[]).map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${(t.rows||[]).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  });
  h += fmtParas(sec.paragraphs2);
  if(sec.note) h += `<div class="note">${esc(sec.note)}</div>`;
  return h;
}

/* ============================================================
   3) التمارين التفاعلية (اختيار من متعدد / صح وخطأ / مقالي)
   ============================================================ */
let MCQ_STATE = {}, TF_STATE = {}, ESSAY_STATE = {};

function mcqState(id){ if(!MCQ_STATE[id]) MCQ_STATE[id]={answers:{},done:false}; return MCQ_STATE[id]; }
function answerMcq(id,i,oi){ const st=mcqState(id); if(st.answers[i]!==undefined) return; st.answers[i]=oi; render(); }
function resetMcq(id){ MCQ_STATE[id]={answers:{},done:false}; render(); }

function scoreClass(pct){ return pct>=80?"good":pct>=50?"mid":"low"; }

function renderMcq(id, qs, heading){
  if(!qs || !qs.length) return "";
  const st = mcqState(id);
  const answered = Object.keys(st.answers).length;
  const score = qs.reduce((a,q,i)=> a + (st.answers[i]===q.correct?1:0), 0);
  const body = qs.map((q,i)=>{
    const ans = st.answers[i], has = ans!==undefined;
    const opts = q.options.map((o,oi)=>{
      let cls="opt";
      if(has){ if(oi===q.correct) cls+=" ok"; else if(oi===ans) cls+=" bad"; }
      return `<button class="${cls}" ${has?"disabled":""} onclick="answerMcq('${id}',${i},${oi})">
        <span class="lbl">${RqLabel(oi)}.</span><span>${esc(o)}</span></button>`;
    }).join("");
    return `<div class="q"><div class="qt"><i>${i+1}</i>${esc(q.q)}</div><div class="opts">${opts}</div>
      ${has && q.explain ? `<div class="expl">${esc(q.explain)}</div>`:""}</div>`;
  }).join("");
  const pct = answered ? Math.round(score/answered*100) : 0;
  return `<div class="qbox">
    <h3>${esc(heading)}</h3>
    <div class="sub">${qs.length} سؤال اختيار من متعدد · تصحيح فوري عند الاختيار</div>
    ${body}
    ${answered ? `<div class="score ${scoreClass(pct)}">أجبت عن ${answered} من ${qs.length} — إجاباتك الصحيحة ${score} (${pct}%)</div>`:""}
    <div class="row" style="margin-top:12px">
      <button class="btn btn-out btn-sm" onclick="resetMcq('${id}')">🔄 إعادة المحاولة</button>
    </div>
  </div>`;
}

function tfState(id){ if(!TF_STATE[id]) TF_STATE[id]={answers:{}}; return TF_STATE[id]; }
function answerTf(id,i,v){ const st=tfState(id); if(st.answers[i]!==undefined) return; st.answers[i]=v; render(); }
function resetTf(id){ TF_STATE[id]={answers:{}}; render(); }

function renderTf(unitId){
  const items = TRUE_FALSE_BANK[unitId]||[];
  if(!items.length) return "";
  const st = tfState(unitId);
  const answered = Object.keys(st.answers).length;
  const score = items.reduce((a,it,i)=> a + (st.answers[i]===it.answer?1:0), 0);
  const rows = items.map((it,i)=>{
    const ans = st.answers[i], has = ans!==undefined;
    const b=(v,l)=>{
      let cls="opt";
      if(has){ if(v===it.answer) cls+=" ok"; else if(v===ans) cls+=" bad"; }
      return `<button class="${cls}" ${has?"disabled":""} onclick="answerTf('${unitId}',${i},${v})">${l}</button>`;
    };
    return `<div class="q"><div class="qt"><i>${i+1}</i>${esc(it.q)}</div>
      <div class="tfrow">${b(true,"✔ صح")}${b(false,"✘ خطأ")}</div>
      ${has && it.explain ? `<div class="expl">${esc(it.explain)}</div>`:""}</div>`;
  }).join("");
  const pct = answered ? Math.round(score/answered*100) : 0;
  return `<div class="qbox">
    <h3>تمرين صح وخطأ</h3>
    <div class="sub">${items.length} عبارة · حدّد صحة كل عبارة وستظهر النتيجة فوراً</div>
    ${rows}
    ${answered ? `<div class="score ${scoreClass(pct)}">أجبت عن ${answered} من ${items.length} — إجاباتك الصحيحة ${score} (${pct}%)</div>`:""}
    <div class="row" style="margin-top:12px"><button class="btn btn-out btn-sm" onclick="resetTf('${unitId}')">🔄 إعادة المحاولة</button></div>
  </div>`;
}

function essayState(id){ if(!ESSAY_STATE[id]) ESSAY_STATE[id]={open:{}}; return ESSAY_STATE[id]; }
function toggleEssay(id,i){ const st=essayState(id); st.open[i]=!st.open[i]; render(); }
function revealAllEssay(id,on){ const st=essayState(id); (ESSAY_BANK[id]||[]).forEach((_,i)=>st.open[i]=on); render(); }

function renderEssay(unitId){
  const items = ESSAY_BANK[unitId]||[];
  if(!items.length) return "";
  const st = essayState(unitId);
  const body = items.map((it,i)=>`
    <div class="it">
      <div class="qt"><i>${i+1}</i>${esc(it.q)}</div>
      <div class="row" style="margin-top:6px">
        <button class="btn btn-out btn-sm" onclick="toggleEssay('${unitId}',${i})">${st.open[i]?"🙈 إخفاء الإجابة":"👁️ إظهار الإجابة"}</button>
      </div>
      ${st.open[i] ? `<div class="ans">${esc(it.a)}</div>`:""}
    </div>`).join("");
  return `<div class="qbox essay">
    <h3>أسئلة مقالية</h3>
    <div class="sub">${items.length} سؤال · حاول الإجابة أولاً ثم اكشف نموذج الإجابة</div>
    ${body}
    <div class="row" style="margin-top:12px">
      <button class="btn btn-out btn-sm" onclick="revealAllEssay('${unitId}',true)">👁️ إظهار كل الإجابات</button>
      <button class="btn btn-ghost btn-sm" onclick="revealAllEssay('${unitId}',false)">🙈 إخفاء الكل</button>
    </div>
  </div>`;
}

/* ============================================================
   4) العرض التقديمي بملء الشاشة
   ============================================================ */
let PRES = null; // {unitId, slides, idx, scale}

function buildSlides(unit){
  const s = [];
  s.push({ type:"title", unitTitle:unit.title, title:unit.subtitle, sub:SETTINGS.title });
  s.push({ type:"objectives", secTitle:"أهداف الوحدة", title:"الهدف العام", body:[unit.objectives.jadara],
           extra:[["المدة التدريبية",unit.objectives.duration],["المتطلب السابق",unit.objectives.requirement]] });
  s.push({ type:"text", secTitle:"أهداف الوحدة", title:"الأهداف التفصيلية", body:[unit.objectives.goals] });
  if(unit.objectives.means && unit.objectives.means.length)
    s.push({ type:"bullets", secTitle:"أهداف الوحدة", title:"الوسائل التدريبية المساعدة", items:unit.objectives.means });

  unit.sections.forEach((sec,si)=>{
    const head = { secTitle:sec.title, secNo:si+1, secTotal:unit.sections.length };
    (sec.paragraphs||[]).forEach((p,pi)=> s.push(Object.assign({type:"text",title:pi===0?sec.title:"",body:[p]},head)));
    (sec.quotes||[]).forEach(q=> s.push(Object.assign({type:"quote",title:"تعريف",body:[q.text]},head)));
    if(sec.list && sec.list.length) chunk(sec.list,3).forEach(g=>
      s.push(Object.assign({type:"defs",title:sec.title,defs:g},head)));
    if(sec.numberedList && sec.numberedList.length) chunk(sec.numberedList,3).forEach(g=>
      s.push(Object.assign({type:"defs",title:sec.title,defs:g.map(x=>({term:x.title,detail:x.detail}))},head)));
    if(sec.formula) s.push(Object.assign({type:"formula",title:sec.title,formula:sec.formula},head));
    (sec.tables||[]).forEach(t=> s.push(Object.assign({type:"table",title:t.title||sec.title,table:t},head)));
    (sec.paragraphs2||[]).forEach(p=> s.push(Object.assign({type:"text",title:"",body:[p]},head)));
    if(sec.note) s.push(Object.assign({type:"note",title:"ملاحظة",body:[sec.note]},head));
  });

  if(unit.glossary && unit.glossary.length) chunk(unit.glossary,3).forEach(g=>
    s.push({ type:"defs", secTitle:"مسرد المصطلحات", title:"مصطلحات الوحدة", defs:g }));
  s.push({ type:"end", title:"انتهت الوحدة", sub:unit.subtitle });
  return s;
}
function chunk(a,n){ const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; }

function openPres(unitId){
  const u = UNITS.find(x=>x.id===unitId); if(!u) return;
  const slides = buildSlides(u);
  let idx = parseInt(lsGet(LS.presPos+unitId,"0"),10) || 0;
  if(idx<0 || idx>=slides.length) idx=0;
  const scale = parseFloat(lsGet(LS.presFont,"1")) || 1;
  PRES = { unitId, slides, idx, scale };
  document.documentElement.style.overflow="hidden";
  render();
  try{ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }catch(e){}
}
function closePres(){
  PRES=null; document.documentElement.style.overflow="";
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  render();
}
function presGo(d){
  if(!PRES) return;
  PRES.idx = Math.max(0, Math.min(PRES.slides.length-1, PRES.idx+d));
  lsSet(LS.presPos+PRES.unitId, String(PRES.idx));
  render();
}
function presFont(d){
  if(!PRES) return;
  PRES.scale = Math.max(.7, Math.min(1.7, +(PRES.scale+d).toFixed(2)));
  lsSet(LS.presFont, String(PRES.scale));
  render();
}
function presRestart(){ if(!PRES) return; PRES.idx=0; lsSet(LS.presPos+PRES.unitId,"0"); render(); }

function renderSlide(sl, k){
  const t=(n)=>`font-size:${(n*k).toFixed(1)}px`;
  let h = `<div class="num">${sl.secNo?`القسم ${sl.secNo} من ${sl.secTotal}`:(sl.secTitle?esc(sl.secTitle):"")}</div>`;
  if(sl.type==="title"){
    return `<div class="num" style="${t(15)}">${esc(sl.unitTitle)}</div>
      <h2 style="${t(42)}">${esc(sl.title)}</h2>
      <p style="${t(19)};text-align:center;text-align-last:center">${esc(sl.sub)}</p>`;
  }
  if(sl.type==="end"){
    return `<h2 style="${t(38)}">${esc(sl.title)}</h2><p style="${t(19)};text-align:center">${esc(sl.sub)}</p>`;
  }
  if(sl.title) h += `<h2 style="${t(30)}">${esc(sl.title)}</h2>`;
  if(sl.type==="quote") h += `<p style="${t(20)};color:#a7f3d0">« ${esc(sl.body[0])} »</p>`;
  else if(sl.type==="note") h += `<p style="${t(18)};color:#fcd34d">💡 ${esc(sl.body[0])}</p>`;
  else if(sl.type==="formula") h += `<div class="fx" style="${t(24)}">${esc(sl.formula)}</div>`;
  else if(sl.type==="bullets") h += `<ul style="${t(19)}">${sl.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  else if(sl.type==="defs") h += `<ul style="${t(18)}">${sl.defs.map(d=>
      `<li><b style="color:#6ee7b7">${esc(d.term)}:</b> ${esc(d.detail)}</li>`).join("")}</ul>`;
  else if(sl.type==="table"){
    const tb=sl.table;
    h += `<table style="${t(15)}"><thead><tr>${tb.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${tb.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  else if(sl.type==="objectives"){
    h += `<p style="${t(19)}">${esc(sl.body[0])}</p>
      <ul style="${t(17)}">${sl.extra.filter(x=>x[1]).map(x=>`<li><b style="color:#6ee7b7">${esc(x[0])}:</b> ${esc(x[1])}</li>`).join("")}</ul>`;
  }
  else h += (sl.body||[]).map(p=>`<p style="${t(19)}">${esc(p)}</p>`).join("");
  return h;
}

function renderPres(){
  const u = UNITS.find(x=>x.id===PRES.unitId);
  const sl = PRES.slides[PRES.idx];
  const pct = ((PRES.idx+1)/PRES.slides.length*100).toFixed(1);
  return `<div class="pres">
    <div class="pres-top">
      <div class="pres-loc">${esc(u.title)}: ${esc(u.subtitle)}${sl.secTitle?`<br><span style="color:#6ee7b7">${esc(sl.secTitle)}</span>`:""}</div>
      <div class="l">
        <button class="pres-btn" onclick="presRestart()" title="من البداية">⟲</button>
        <button class="pres-btn" onclick="presFont(-0.1)" title="تصغير الخط">A−</button>
        <button class="pres-btn" onclick="presFont(0.1)" title="تكبير الخط">A+</button>
        <span class="pres-save">💾 حفظ الموضع تلقائياً</span>
        <button class="pres-btn" onclick="closePres()" title="إغلاق (Esc)">✕ إغلاق</button>
      </div>
    </div>
    <div class="pres-stage"><div class="slide thin-scroll">${renderSlide(sl, PRES.scale)}</div></div>
    <div class="pres-bot">
      <button class="pres-btn" onclick="presGo(1)">▶ التالي</button>
      <div class="pres-track"><i style="width:${pct}%"></i></div>
      <span class="pres-count"><bdi>${PRES.idx+1}</bdi> / <bdi>${PRES.slides.length}</bdi></span>
      <button class="pres-btn" onclick="presGo(-1)" ${PRES.idx===0?"disabled style=opacity:.4":""}>◂ السابق</button>
    </div>
  </div>`;
}

document.addEventListener("keydown", function(e){
  if(PRES){
    if(e.key==="Escape"){ e.preventDefault(); closePres(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); presGo(1); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); presGo(-1); }
    else if(e.key==="+"||e.key==="="){ presFont(0.1); }
    else if(e.key==="-"){ presFont(-0.1); }
    return;
  }
  if(e.key==="Escape"){
    if(PPTX_OPEN){ closePptx(); } else if(RQ_OPEN){ closeRq(); }
    else if(EXAM_OPEN){ closeExam(); } else if(GUIDE_OPEN){ closeGuide(); }
    else if(SETTINGS_OPEN){ closeSettings(); }
  }
});

let PRINT_JOB = null; // {html, title}
function printHtml(html){
  PRINT_JOB = html; render();
  setTimeout(()=>{ window.print(); }, 220);
  const done = ()=>{ PRINT_JOB=null; render(); window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint", done);
  setTimeout(()=>{ if(PRINT_JOB){ PRINT_JOB=null; render(); } }, 6000);
}
function sheetHeader(title, sub, opts){
  opts = opts||{};
  const org = (opts.orgLines && opts.orgLines.length ? opts.orgLines : orgLinesFromSettings());
  const align = opts.align || "right";
  return `<div class="hd">
    ${org.length?`<div class="org" style="text-align:${align}">${org.map(l=>esc(l)).join("<br>")}</div>`:""}
    <h1>${esc(title)}</h1>
    ${sub?`<div class="sub">${esc(sub)}</div>`:""}
    ${SETTINGS.author?`<div class="sub" style="margin-top:3px">إعداد: ${esc(SETTINGS.author)}</div>`:""}
  </div>`;
}
function courseLine(showName, showCode){
  const a = []; if(showName) a.push(SETTINGS.title); if(showCode && SETTINGS.courseCode) a.push(SETTINGS.courseCode);
  return a.join(" — ");
}

function printUnit(unitId){
  const u = UNITS.find(x=>x.id===unitId); if(!u) return;
  const qs = QUIZ_BANK[unitId]||[], tf = TRUE_FALSE_BANK[unitId]||[], es = ESSAY_BANK[unitId]||[];
  const lesson = u.sections.map(s=>`
    <h3 style="font-size:15px;color:#065f46;margin:16px 0 5px">${esc(s.title)}</h3>
    ${(s.paragraphs||[]).map(p=>`<p style="font-size:13.5px;line-height:1.95;text-align:justify">${esc(p)}</p>`).join("")}
    ${(s.quotes||[]).map(q=>`<p style="font-size:13.5px;background:#ecfdf5;padding:9px 13px;border-right:3px solid #059669">${esc(q.text)}</p>`).join("")}
    ${(s.list||[]).length?`<ul style="font-size:13.5px;line-height:1.95">${s.list.map(x=>`<li><b>${esc(x.term)}:</b> ${esc(x.detail)}</li>`).join("")}</ul>`:""}
    ${(s.numberedList||[]).length?`<ol style="font-size:13.5px;line-height:1.95">${s.numberedList.map(x=>`<li><b>${esc(x.title)}:</b> ${esc(x.detail)}</li>`).join("")}</ol>`:""}
    ${s.formula?`<p style="text-align:center;font-weight:800;background:#0f172a;color:#a7f3d0;padding:9px;border-radius:8px">${esc(s.formula)}</p>`:""}
    ${(s.tables||[]).map(t=>`<table style="width:100%;border-collapse:collapse;font-size:12.5px;margin:9px 0">
      <thead><tr>${t.columns.map(c=>`<th style="border:1px solid #94a3b8;padding:6px;background:#f1f5f9">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td style="border:1px solid #cbd5e1;padding:6px">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`).join("")}
    ${(s.paragraphs2||[]).map(p=>`<p style="font-size:13.5px;line-height:1.95;text-align:justify">${esc(p)}</p>`).join("")}
    ${s.note?`<p style="font-size:13px;background:#fffbeb;border:1px solid #fde68a;padding:9px 13px;border-radius:6px">💡 ${esc(s.note)}</p>`:""}
  `).join("");
  const ex = `
    <h2 style="font-size:16px;color:#065f46;margin:24px 0 8px;border-bottom:2px solid #065f46;padding-bottom:5px">التمارين</h2>
    <h3 style="font-size:14px;margin:12px 0 6px">أولاً: اختيار من متعدد (${qs.length})</h3>
    ${qs.map((q,i)=>`<div class="qq"><div class="t">${i+1}. ${esc(q.q)}</div>
      <div class="oo">${q.options.map((o,oi)=>`<div${oi===q.correct?' class="ok"':''}>${RqLabel(oi)}. ${esc(o)}${oi===q.correct?" ✓":""}</div>`).join("")}</div></div>`).join("")}
    <h3 style="font-size:14px;margin:16px 0 6px">ثانياً: صح وخطأ (${tf.length})</h3>
    ${tf.map((t,i)=>`<div class="qq"><div class="t">${i+1}. ${esc(t.q)} <span class="ok">(${t.answer?"صح":"خطأ"})</span></div></div>`).join("")}
    <h3 style="font-size:14px;margin:16px 0 6px">ثالثاً: أسئلة مقالية (${es.length})</h3>
    ${es.map((e,i)=>`<div class="qq"><div class="t">${i+1}. ${esc(e.q)}</div>
      <div style="font-size:12.5px;color:#065f46;padding-inline-start:16px">${esc(e.a)}</div></div>`).join("")}`;
  printHtml(`<div class="sheet">${sheetHeader(u.title+": "+u.subtitle, courseLine(true,true))}
    <p style="font-size:13px;background:#ecfdf5;padding:10px 14px;border-radius:8px"><b>الهدف العام:</b> ${esc(u.objectives.jadara)}</p>
    ${lesson}${ex}</div>`);

const LOGO_PX = { sm:42, mid:66, lg:96 };
function examUploadLogo(input){
  const f = input.files && input.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ alert("الرجاء اختيار ملف صورة (PNG أو JPG أو SVG)."); input.value=""; return; }
  if(f.size > 5*1024*1024){ alert("حجم الملف كبير جداً — اختر صورة أقل من 5 ميجابايت."); input.value=""; return; }
  const fr = new FileReader();
  fr.onload = ()=>{
    // تصغير الصورة إلى حد معقول قبل تضمينها حتى لا يثقل الملف ولا تمتلئ ذاكرة المتصفح
    const img = new Image();
    img.onload = ()=>{
      const max = 512;
      const k = Math.min(1, max/Math.max(img.width, img.height));
      let out;
      try{
        const cv = document.createElement("canvas");
        cv.width  = Math.max(1, Math.round(img.width*k));
        cv.height = Math.max(1, Math.round(img.height*k));
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        out = cv.toDataURL("image/png");
      }catch(e){ out = fr.result; }
      if(out.length > fr.result.length) out = fr.result;
      EXAM_CFG.logo = out; EXAM_CFG.showLogo = true;
      lsSet(LS.logo, out);
      render();
    };
    img.onerror = ()=>{ EXAM_CFG.logo = fr.result; EXAM_CFG.showLogo = true; lsSet(LS.logo, fr.result); render(); };
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
}

  try{ localStorage.removeItem(LS.logo); }catch(e){}

}
function examToggleHeaderItem(key){

function examSetHeaderLabel(key,v){

function examToggleManual(uid,i){
  EXAM_CFG.manual[uid]=EXAM_CFG.manual[uid]||{};
  if(EXAM_CFG.manual[uid][i]) delete EXAM_CFG.manual[uid][i]; else EXAM_CFG.manual[uid][i]=true;
  render();

function examAvailable(){ return EXAM_CFG.unitIds.reduce((a,id)=>a+((QUIZ_BANK[id]||[]).length),0); }
function examManualCount(){ return Object.values(EXAM_CFG.manual).reduce((a,o)=>a+Object.keys(o).length,0); }

function buildExam(){
  let pool=[];
  EXAM_CFG.unitIds.forEach(id=>{
    const u=UNITS.find(x=>x.id===id); if(!u) return;
    (QUIZ_BANK[id]||[]).forEach((q,i)=>{
      if(EXAM_CFG.selectMethod==="manual" && !(EXAM_CFG.manual[id]&&EXAM_CFG.manual[id][i])) return;
      pool.push(Object.assign({},q,{unitTitle:u.title+": "+u.subtitle}));
    });
  });
  if(EXAM_CFG.selectMethod==="random") pool=shuffle(pool);
  if(EXAM_CFG.selectMethod!=="manual") pool=pool.slice(0, Math.max(1, EXAM_CFG.count));
  return pool;
}
function examSheetHtml(questions, solved, forWord){
  const c=EXAM_CFG;
  const org = c.showOrg ? (c.orgLines.trim()? c.orgLines.split("\n").filter(Boolean) : orgLinesFromSettings()) : [];
  const layout = c.optionsLayout==="one"?"one":c.optionsLayout==="inline"?"inl":"";
  const chosen = STUDENT_FIELDS.filter(f=>c.fields.includes(f[0]));
  // في Word تُستخدم جداول بدل grid/flex لأن Word لا يدعمهما
  const fields = !chosen.length ? "" : (forWord
    ? `<table class="info"><tr>${chosen.map(f=>
        `<td>${esc(f[1])}: ــــــــــــــــــــ</td>`).join("")}</tr></table>`
    : `<div class="info">${chosen.map(f=>`<div>${esc(f[1])}: ــــــــــــــــــــ</div>`).join("")}</div>`);
  const optCell = (q,oi)=>{
    const ok = solved && oi===q.correct;
    return { ok, html: `${RqLabel(oi)}. ${esc(q.options[oi])}${ok?" ✓":""}` };
  };
  const optsWord = (q)=>{
    const n = q.options.length;
    const cols = c.optionsLayout==="one" ? 1 : c.optionsLayout==="inline" ? n : 2;
    let rows="";
    for(let i=0;i<n;i+=cols){
      rows += `<tr>${Array.from({length:cols},(_,k)=>{
        const oi=i+k; if(oi>=n) return `<td></td>`;
        const o=optCell(q,oi);
        return `<td${o.ok?' class="ok"':''} style="width:${Math.floor(100/cols)}%">${o.html}</td>`;
      }).join("")}</tr>`;
    }
    return `<table class="oo"><tbody>${rows}</tbody></table>`;
  };
  const qs = questions.map((q,i)=>`<div class="qq">
      <div class="t" style="font-size:${c.qFontSize}px">${i+1}. ${esc(q.q)}</div>
      ${ forWord ? optsWord(q) : `<div class="oo ${layout}">${q.options.map((o,oi)=>{
        const ok = solved && oi===q.correct;
        return `<div${ok?' class="ok"':''}>${RqLabel(oi)}. ${esc(o)}${ok?" ✓":""}</div>`;
      }).join("")}</div>`}</div>`).join("");
  const key = solved ? `<div class="key"><b>نموذج الإجابة:</b> ${
      questions.map((q,i)=>`${i+1}-${RqLabel(q.correct)}`).join(" · ")}</div>` : "";
  const hinfo = c.showHeaderInfo ? c.headerInfo.filter(x=>x.on) : [];
  const hinfoHtml = hinfo.length ? `<div class="hinfo">${hinfo.map(x=>
      `<div class="r"><b>${esc(x.label)}:</b>${ x.value.trim()
          ? `<span class="v">${esc(x.value)}</span>`
          : `<span class="dots"></span>` }</div>`).join("")}</div>` : "";
  const logoHtml = (c.showLogo && c.logo)
    ? `<img class="hdlogo" src="${c.logo}" alt="" style="height:${LOGO_PX[c.logoSize]||LOGO_PX.mid}px">` : "";
  const hdTop = (org.length || hinfo.length || logoHtml) ? `<table class="hdtop"><tr>
      <td class="c-org" style="text-align:${c.orgAlign}">${org.map(esc).join("<br>")}</td>
      <td class="c-logo">${logoHtml}</td>
      <td class="c-info">${hinfoHtml}</td>
    </tr></table>` : "";
  const inner = `<div class="sheet" style="font-family:'${c.fontFamily}',Arial,sans-serif;font-size:${c.fontSize}px">
    <div class="hd">
      ${hdTop}
      <h1${forWord?' align="center"':''}>${esc(c.name)}</h1>
      ${courseLine(c.showCourseName,c.showCourseCode)?`<div class="sub"${forWord?' align="center"':''}>${esc(courseLine(c.showCourseName,c.showCourseCode))}</div>`:""}
      ${c.showInstructor && SETTINGS.author?`<div class="sub"${forWord?' align="center"':''} style="margin-top:3px">معدّ الاختبار: ${esc(SETTINGS.author)}</div>`:""}
    </div>
    ${fields}
    <div style="font-size:${c.fontSize-1}px;color:#475569;margin-bottom:12px">
      عدد الأسئلة: ${questions.length} — اختر الإجابة الصحيحة لكل سؤال.</div>
    ${qs}${key}</div>`;
  if(!forWord) return inner;
  return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(c.name)}</title>
    <style>
      body{font-family:'${c.fontFamily}','Arial',sans-serif;font-size:${c.fontSize}px;direction:rtl;line-height:1.9;color:#000}
      .sheet{padding:0}
      .hd{border-bottom:2px solid #065f46;padding-bottom:10px;margin-bottom:14px}
      table.hdtop{width:100%;border-collapse:collapse;margin-bottom:6px}
      table.hdtop td{border:0;padding:0;vertical-align:top}
      td.c-org{width:38%;font-size:12px;color:#333;line-height:1.7}
      td.c-logo{width:24%;text-align:center}
      td.c-info{width:38%;text-align:left}
      img.hdlogo{max-width:100%}
      .hinfo{display:inline-block;font-size:12px;color:#333;line-height:1.9;text-align:right}
      .hinfo .r{white-space:nowrap;margin-bottom:2px}
      .hinfo .r b{font-weight:bold;display:inline-block;min-width:76px}
      .hinfo .dots{display:inline-block;min-width:90px;border-bottom:1px dotted #475569;margin-right:5px}
      .hinfo .v{margin-right:5px}
      .hd h1{font-size:19px;color:#065f46;text-align:center;margin:8px 0 4px}
      .hd .sub{text-align:center;font-size:12.5px;color:#444}
      table.info{width:100%;border-collapse:collapse;margin-bottom:14px;padding-bottom:9px;
        border-bottom:1px dashed #888;font-size:13px}
      table.info td{border:0;padding:0 0 6px 0;text-align:right}
      .qq{margin-bottom:12px;page-break-inside:avoid}
      .qq .t{font-weight:bold;margin-bottom:4px}
      table.oo{width:100%;border-collapse:collapse;margin:0 0 4px 0}
      table.oo td{border:0;padding:1px 16px 1px 6px;vertical-align:top;text-align:right}
      .ok{color:#047857;font-weight:bold}
      .key{margin-top:18px;padding-top:10px;border-top:2px solid #065f46;font-size:12.5px}
    </style></head><body>${inner}</body></html>`;
}
function downloadBlob(content, filename, type){
  const blob=new Blob(['﻿',content],{type});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function generateExam(){
  const qs = buildExam();
  if(!qs.length){ alert("لا توجد أسئلة مطابقة للاختيار الحالي."); return; }
  const solved = EXAM_CFG.version==="solved";
  if(EXAM_CFG.formats.word){
    downloadBlob(examSheetHtml(qs,solved,true), `${EXAM_CFG.name}-${solved?"محلول":"غير-محلول"}.doc`, "application/msword");
  }
  if(EXAM_CFG.formats.pdf){
    EXAM_OPEN=false;
    printHtml(examSheetHtml(qs,solved,false));
    return;
  }
  if(!EXAM_CFG.formats.word) alert("اختر صيغة تصدير واحدة على الأقل (PDF أو Word).");
}

let RQ_OPEN=false, RQ_SEL={units:{}, types:{mcq:true, tf:true, essay:false}}, RQ_POOL=null;
UNITS.forEach(u=>RQ_SEL.units[u.id]=false);
function openRq(){ RQ_OPEN=true; render(); }
function closeRq(){ RQ_OPEN=false; render(); }
function rqToggleUnit(id){ RQ_SEL.units[id]=!RQ_SEL.units[id]; RQ_POOL=null; render(); }
function rqToggleType(k){ RQ_SEL.types[k]=!RQ_SEL.types[k]; RQ_POOL=null; render(); }
function rqAll(on){ UNITS.forEach(u=>RQ_SEL.units[u.id]=on); RQ_POOL=null; render(); }
function rqCount(){
  let n=0;
  UNITS.forEach(u=>{ if(!RQ_SEL.units[u.id]) return;
    if(RQ_SEL.types.mcq) n+=(QUIZ_BANK[u.id]||[]).length;
    if(RQ_SEL.types.tf)  n+=(TRUE_FALSE_BANK[u.id]||[]).length;
    if(RQ_SEL.types.essay) n+=(ESSAY_BANK[u.id]||[]).length;
  });
  return n;
}
function rqGenerate(){
  const pool=[];
  UNITS.forEach(u=>{
    if(!RQ_SEL.units[u.id]) return;
    const tag = u.title+": "+u.subtitle;
    if(RQ_SEL.types.mcq) (QUIZ_BANK[u.id]||[]).forEach(q=>{
      // خلط الخيارات بخوارزمية Fisher-Yates مع تتبّع الإجابة الصحيحة
      const idx = shuffle(q.options.map((_,i)=>i));
      pool.push({ kind:"mcq", unit:tag, q:q.q,
        options: idx.map(i=>q.options[i]),
        correct: idx.indexOf(q.correct) });
    });
    if(RQ_SEL.types.tf) (TRUE_FALSE_BANK[u.id]||[]).forEach(t=>
      pool.push({ kind:"tf", unit:tag, q:t.q, answer:t.answer, explain:t.explain }));
    if(RQ_SEL.types.essay) (ESSAY_BANK[u.id]||[]).forEach(e=>
      pool.push({ kind:"essay", unit:tag, q:e.q, a:e.a }));
  });
  if(!pool.length){ alert("اختر وحدة واحدة على الأقل ونوع سؤال واحد على الأقل."); return; }
  RQ_POOL = shuffle(pool);
  render();
}
function rqSheet(solved){
  if(!RQ_POOL) return "";
  let n=0;
  const items = RQ_POOL.map(it=>{
    n++;
    if(it.kind==="mcq") return `<div class="qq">
      <div class="t">${n}. ${esc(it.q)}</div>
      <div class="oo">${it.options.map((o,oi)=>{
        const ok = solved && oi===it.correct;
        return `<div${ok?' class="ok"':''}>${RqLabel(oi)}. ${esc(o)}${ok?" ✓":""}</div>`;
      }).join("")}</div></div>`;
    if(it.kind==="tf") return `<div class="qq"><div class="t">${n}. ${esc(it.q)}
      ${solved?`<span class="ok">(${it.answer?"صح":"خطأ"})</span>`:`<span style="color:#64748b">( صح / خطأ )</span>`}</div>
      ${solved && it.explain?`<div style="font-size:12.5px;color:#475569;padding-inline-start:16px">${esc(it.explain)}</div>`:""}</div>`;
    return `<div class="qq"><div class="t">${n}. ${esc(it.q)}</div>
      ${solved?`<div style="font-size:12.5px;color:#047857;padding-inline-start:16px">${esc(it.a)}</div>`
              :`<div style="border-bottom:1px dotted #94a3b8;height:20px;margin:4px 16px"></div>
                <div style="border-bottom:1px dotted #94a3b8;height:20px;margin:4px 16px"></div>`}</div>`;
  }).join("");
  return `<div class="sheet">${sheetHeader("أسئلة مراجعة", (solved?"نسخة محلولة":"نسخة غير محلولة")+" · "+todayAr())}
    <div style="font-size:13px;color:#475569;margin-bottom:12px">عدد الأسئلة: ${RQ_POOL.length}</div>
    ${items}</div>`;
}
function rqPrint(solved){ RQ_OPEN=false; printHtml(rqSheet(solved)); }

let PPTX_OPEN=false, PPTX_SCOPE="all", PPTX_BUSY=false;
const PPTX_FONT = "Arial";       // خط متوفر على كل أجهزة ويندوز وماك — يمنع ظهور الرموز
const PPTX_FONT_HEAD = "Arial";
let PPTX_CFG = {
  level:"full", notes:true, questions:"none",
  showCourseName:true, showCourseCode:true, showAuthor:true, merge:false
};
function openPptx(scope){ PPTX_SCOPE=scope||"all"; PPTX_OPEN=true; render(); }
function closePptx(){ PPTX_OPEN=false; render(); }
function pptxSet(k,v){ PPTX_CFG[k]=v; render(); }

const PX = { bg:"F8FAFC", ink:"0F172A", soft:"334155", em:"047857", emD:"064E3B", emL:"ECFDF5", gold:"B45309" };
const PPTX_LANG = "ar-SA";
/* كل نص عربي يجب أن يحمل lang="ar-SA" وإلا عاملته باوربوينت كنص لاتيني فانعكس اتجاه السطر */
function AR(o){ return Object.assign({ lang:PPTX_LANG, rtlMode:true, fontFace:PPTX_FONT }, o||{}); }

function pptxAddTitle(pptx){
  const s = pptx.addSlide();
  s.background = { color: PX.emD };
  s.addText(SETTINGS.title, AR({ x:0.5, y:1.7, w:9, h:1.0, fontSize:40, bold:true, color:"FFFFFF",
    fontFace:PPTX_FONT_HEAD, align:"center" }));
  const sub=[];
  if(PPTX_CFG.showCourseCode && SETTINGS.courseCode) sub.push(SETTINGS.courseCode);
  if(COURSE_META.specialty) sub.push("تخصص "+COURSE_META.specialty);
  if(sub.length) s.addText(sub.join("  ·  "), AR({ x:0.5, y:2.75, w:9, h:0.5, fontSize:20, color:"A7F3D0", align:"center" }));
  const org = orgLinesFromSettings();
  if(org.length) s.addText(org.join("  ·  "), AR({ x:0.5, y:3.35, w:9, h:0.5, fontSize:14, color:"D1FAE5", align:"center" }));
  if(PPTX_CFG.showAuthor && SETTINGS.author) s.addText("إعداد: "+SETTINGS.author, AR({ x:0.5, y:4.4, w:9, h:0.4,
    fontSize:14, color:"6EE7B7", align:"center" }));
}
function pptxSectionSlide(pptx, unit){
  const s = pptx.addSlide();
  s.background = { color: PX.em };
  s.addText(unit.title, AR({ x:0.6, y:2.0, w:8.8, h:0.5, fontSize:18, color:"A7F3D0", align:"right" }));
  s.addText(unit.subtitle, AR({ x:0.6, y:2.45, w:8.8, h:1.2, fontSize:32, bold:true, color:"FFFFFF",
    fontFace:PPTX_FONT_HEAD, align:"right", valign:"top", shrinkText:true, wrap:true }));
}
function pptxBody(pptx, head, blocks){
  const s = pptx.addSlide();
  s.background = { color:"FFFFFF" };
  s.addText(head||"", AR({ x:0.5, y:0.26, w:9, h:0.74, fontSize:22, bold:true, color:PX.emD,
    fontFace:PPTX_FONT_HEAD, align:"right", valign:"middle", shrinkText:true, wrap:true }));
  s.addShape(pptx.ShapeType.rect, { x:0.5, y:1.1, w:9, h:0.03, fill:{ color: PX.em } });
  s.addText(blocks, AR({ x:0.5, y:1.26, w:9, h:3.94, fontSize:17, color:PX.soft,
    align:"right", valign:"top", lineSpacingMultiple:1.45, shrinkText:true }));
  return s;
}
function pptxTable(pptx, head, t){
  const s = pptx.addSlide();
  s.background = { color:"FFFFFF" };
  s.addText(head, AR({ x:0.5, y:0.26, w:9, h:0.74, fontSize:20, bold:true, color:PX.emD,
    fontFace:PPTX_FONT_HEAD, align:"right", valign:"middle", shrinkText:true, wrap:true }));
  const rows = [ t.columns.slice().reverse().map(c=>({ text:c,
      options:AR({ bold:true, color:"FFFFFF", fill:{ color:PX.em }, align:"right" }) })) ];
  t.rows.forEach(r=> rows.push(r.slice().reverse().map(c=>({ text:c,
      options:AR({ color:PX.soft, align:"right" }) }))));
  s.addTable(rows, AR({ x:0.5, y:1.24, w:9, fontSize:12, border:{ pt:0.5, color:"CBD5E1" }, autoPage:true }));
}
function txt(s, o){ return { text:s, options:Object.assign({ breakLine:true }, AR(o)) }; }

function buildPptxForUnit(pptx, unit){
  const C=PPTX_CFG;
  pptxSectionSlide(pptx, unit);
  // أهداف الوحدة
  const obj=[ txt("الهدف العام", { bold:true, color:PX.em, fontSize:18 }), txt(unit.objectives.jadara, { fontSize:16 }) ];
  if(C.level==="full"){
    obj.push(txt("الأهداف التفصيلية", { bold:true, color:PX.em, fontSize:18 }));
    obj.push(txt(unit.objectives.goals, { fontSize:15 }));
  }
  obj.push(txt("المدة: "+unit.objectives.duration, { fontSize:15, color:PX.gold }));
  pptxBody(pptx, unit.title+" — أهداف الوحدة", obj);

  unit.sections.forEach(sec=>{
    let buf=[], count=0;
    const flush=(head)=>{ if(buf.length){ pptxBody(pptx, head||sec.title, buf); buf=[]; count=0; } };
    const push=(t,o,weight)=>{
      buf.push(txt(t,o)); count += (weight||1);
      const cap = C.merge ? 6 : 3;
      if(count>=cap) flush();
    };
    (sec.paragraphs||[]).forEach(p=> push(p, { fontSize:17 }, C.merge?1:2));
    (sec.quotes||[]).forEach(q=> push("« "+q.text+" »", { fontSize:16, italic:true, color:PX.em }, 2));
    (sec.list||[]).forEach(it=> push("• "+it.term+": "+it.detail, { fontSize:15 }, 1));
    (sec.numberedList||[]).forEach((it,i)=> push((i+1)+". "+it.title+": "+it.detail, { fontSize:15 }, 1));
    if(sec.formula){ flush(); const s=pptxBody(pptx, sec.title, [txt(sec.formula,{ fontSize:30, bold:true, color:PX.em, align:"center" })]); }
    if(C.level==="full") (sec.paragraphs2||[]).forEach(p=> push(p, { fontSize:17 }, C.merge?1:2));
    if(C.notes && sec.note) push("💡 "+sec.note, { fontSize:15, color:PX.gold }, 2);
    flush();
    (sec.tables||[]).forEach(t=> pptxTable(pptx, t.title||sec.title, t));
  });

  if(C.level==="full" && unit.glossary && unit.glossary.length){
    chunk(unit.glossary,5).forEach(g=> pptxBody(pptx, "مصطلحات "+unit.title,
      g.map(x=> txt("• "+x.term+": "+x.detail, { fontSize:15 }))));
  }

  if(C.questions!=="none"){
    const qs = QUIZ_BANK[unit.id]||[];
    const per = C.merge ? 3 : 2;
    chunk(qs, per).forEach((g,gi)=>{
      const blocks=[];
      g.forEach((q,i)=>{
        blocks.push(txt((gi*per+i+1)+". "+q.q, { bold:true, fontSize:16, color:PX.ink }));
        q.options.forEach((o,oi)=>{
          const ok = C.questions==="solved" && oi===q.correct;
          blocks.push(txt("   "+RqLabel(oi)+". "+o+(ok?"  ✓":""),
            { fontSize:14, color: ok?PX.em:PX.soft, bold:!!ok }));
        });
      });
      pptxBody(pptx, "تدريبات — "+unit.subtitle, blocks);
    });
  }
}

function exportPptx(){
  if(typeof PptxGenJS==="undefined"){ alert("مكتبة العروض غير محمّلة."); return; }
  PPTX_BUSY=true; render();
  setTimeout(()=>{
    try{
      const pptx = new PptxGenJS();
      pptx.layout = "LAYOUT_16x9";
      pptx.rtlMode = true;
      pptx.author = SETTINGS.author || SETTINGS.title;
      pptx.title  = SETTINGS.title;
      pptxAddTitle(pptx);
      const list = PPTX_SCOPE==="all" ? UNITS : UNITS.filter(u=>u.id===PPTX_SCOPE);
      list.forEach(u=> buildPptxForUnit(pptx, u));
      const name = (PPTX_SCOPE==="all" ? SETTINGS.title : (UNITS.find(u=>u.id===PPTX_SCOPE)||{}).subtitle) || "عرض";
      pptx.writeFile({ fileName: name.replace(/[\\/:*?"<>|]/g,"") + ".pptx" })
        .then(()=>{ PPTX_BUSY=false; PPTX_OPEN=false; render(); })
        .catch(e=>{ PPTX_BUSY=false; render(); alert("تعذّر إنشاء الملف: "+e.message); });
    }catch(e){ PPTX_BUSY=false; render(); alert("تعذّر إنشاء الملف: "+e.message); }
  }, 60);
}

 ]}

function hl(t,q){
  if(!q) return esc(t);
  const i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));
}
function guideListHtml(){
  const q=GUIDE_Q.trim();
  const secs = GUIDE.filter(s=>{
    if(!q) return true;
    const blob=[s.title,...(s.paras||[]),...(s.steps||[]),...(s.paras2||[])].join(" ");
    return blob.toLowerCase().includes(q.toLowerCase());
  });
  if(!secs.length) return `<p class="muted small">لا نتائج مطابقة لبحثك.</p>`;
  return secs.map(s=>{
    const open = q ? true : !!GUIDE_SEC[s.id];
    return `<div class="g-sec">
      <button onclick="guideToggle('${s.id}')"><span>${s.icon} ${hl(s.title,q)}</span><span>${open?"▲":"▼"}</span></button>
      <div class="g-body g-hit ${open?"open":""}">
        ${(s.paras||[]).map(p=>`<p>${hl(p,q)}</p>`).join("")}
        ${(s.steps||[]).length?`<ol>${s.steps.map(x=>`<li>${hl(x,q)}</li>`).join("")}</ol>`:""}
        ${(s.paras2||[]).map(p=>`<p style="margin-top:10px">${hl(p,q)}</p>`).join("")}
      </div></div>`;
  }).join("");
}

/* ============================================================
   11) التوجيه والعرض
   ============================================================ */
function currentRoute(){ return (location.hash.replace(/^#/,"") || "/"); }

/* حفظ موضع التمرير عبر عمليات إعادة الرسم (حتى لا تقفز النافذة لأعلى عند كل اختيار) */
function captureScroll(){
  const m = { win: window.scrollY };
  const ov = document.querySelector(".ov");
  if(ov){
    m.ov = ov.scrollTop;
    const mb = ov.querySelector(".m-body");
    if(mb) m.mb = mb.scrollTop;
  }
  const nav = document.querySelector(".sb-nav");
  if(nav) m.nav = nav.scrollTop;
  return m;
}
function restoreScroll(m){
  if(!m) return;
  const nav = document.querySelector(".sb-nav");
  if(nav && typeof m.nav==="number") nav.scrollTop = m.nav;
  const ov = document.querySelector(".ov");
  if(ov){
    if(typeof m.ov==="number") ov.scrollTop = m.ov;
    const mb = ov.querySelector(".m-body");
    if(mb && typeof m.mb==="number") mb.scrollTop = m.mb;
  }
  if(typeof m.win==="number" && window.scrollY!==m.win) window.scrollTo(0, m.win);
}

function render(){
  const root = $("app");
  const _memo = captureScroll();
  try { return renderInner(root, _memo); } finally { restoreScroll(_memo); }
}
function renderInner(root, _memo){
  if(PRINT_JOB){ root.innerHTML = `<div class="print-area">${PRINT_JOB}</div>`; document.body.classList.add("printing"); return; }
  document.body.classList.remove("printing");
  if(PRES){ root.innerHTML = renderPres(); return; }

  const path = currentRoute();
  let body="", active="#/";
  if(path.startsWith("/unit/")){
    const u = UNITS.find(x=>x.id===path.split("/")[2]);
    if(u){ body=renderUnit(u); active="#/unit/"+u.id; } else { body=renderHome(); }
  }
  else if(path==="/glossary"){ body=renderGlossary(); active="#/glossary"; }
  else if(path==="/map"){ body=renderMap(); active="#/map"; }
  else body = renderHome();

  const overlays =
    (SETTINGS_OPEN?renderSettingsModal():"") +
    (GUIDE_OPEN?renderGuideModal():"") +
    (EXAM_OPEN?renderExamModal():"") +
    (RQ_OPEN?renderRqModal():"") +
    (PPTX_OPEN?renderPptxModal():"");

  root.innerHTML = `
    <div class="mbar no-print">
      <b>${esc(SETTINGS.title)}</b>
      <button class="mbtn" onclick="toggleSb()">☰ القائمة</button>
    </div>
    <div class="shell">
      ${renderSidebar(active)}
      <main class="main"><div class="wrap">${body}</div></main>
    </div>
    ${SB_OPEN?`<div class="scrim no-print" onclick="toggleSb()"></div>`:""}
    <div class="fabs rt no-print">
      <button class="fab green" onclick="openExam()">🧾 <span class="t">توليد اختبار</span></button>
    </div>
    <div class="fabs lf no-print">
      <div class="row" style="gap:8px">
        <button class="fab-mini" onclick="toTop()" title="أعلى الصفحة">🔺</button>
        <button class="fab-mini" onclick="openGuide()" title="دليل الاستخدام">❓</button>
      </div>
      <button class="fab blue" onclick="openRq()">📝 <span class="t">أسئلة مراجعة</span></button>
    </div>
    ${overlays}`;
}

window.addEventListener("hashchange", ()=>{ SB_OPEN=false; render(); window.scrollTo({top:0}); });
